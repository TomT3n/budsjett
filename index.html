<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#EAF0F1">
<title>Budsjett</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Personlig budsjett fra kontoutskrift. Alt lagres lokalt på enheten.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F1; --surface:#FFFFFF; --ink:#14303A; --muted:#5B6F76; --line:#D3DDE0;
  --accent:#0F5E73; --accent-ink:#FFFFFF; --good:#2E7D4F; --bad:#B4464B; --warn:#C9722F;
  --sheet-shadow:0 -8px 30px rgba(20,48,58,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E23; --surface:#172A30; --ink:#E4EDEF; --muted:#90A5AB; --line:#27414A;
    --accent:#5BB6CF; --accent-ink:#0F1E23; --good:#6CC592; --bad:#E3787C; --warn:#E9A15F;
    --sheet-shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E23; --surface:#172A30; --ink:#E4EDEF; --muted:#90A5AB; --line:#27414A;
  --accent:#5BB6CF; --accent-ink:#0F1E23; --good:#6CC592; --bad:#E3787C; --warn:#E9A15F;
  --sheet-shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; padding-bottom:84px}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
main{max-width:560px; margin:0 auto; padding:12px 16px 24px}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.01em}
h2{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num,.figures strong,.amt,.budget-row input,.bars text{white-space:nowrap; font-variant-numeric:tabular-nums}

/* Periodevelger */
.period{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 12px}
.period button.arrow{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:1.3rem; line-height:1}
.period button.arrow:disabled{opacity:.35}
.period .label{border:0; background:none; font-size:1.25rem; font-weight:700; padding:8px 12px; border-radius:10px}

/* Nøkkeltall */
.figures{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:20px}
.figures div{background:var(--surface); padding:10px 12px}
.figures span{display:block; font-size:.8rem; color:var(--muted)}
.figures strong{font-size:1.05rem; font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* Smultring */
.donut-wrap{position:relative; width:min(78vw,300px); margin:4px auto 18px}
.donut{display:block; width:100%; height:auto}
.donut .seg{cursor:pointer; transition:stroke-width .15s}
.donut .seg:hover{stroke-width:30}
.donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; text-align:center}
.donut-center .big{font-size:clamp(1.4rem,6vw,1.9rem); font-weight:800; letter-spacing:-.02em}
.donut-center .cap{font-size:.85rem; color:var(--muted); max-width:60%}

/* Kategoriliste */
.list{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.list li + li{border-top:1px solid var(--line)}
.row{display:grid; grid-template-columns:14px 1fr auto; gap:10px; align-items:center; width:100%; padding:12px 14px; background:none; border:0; text-align:left}
.dot{width:12px; height:12px; border-radius:4px}
.row .name{font-weight:600}
.row .meter{grid-column:2 / 4; height:4px; background:var(--line); border-radius:2px; margin-top:-2px}
.row .meter i{border-radius:2px}
.row .meter i{display:block; height:100%}
.row .pct{color:var(--muted); font-size:.8rem; margin-left:6px}
.row .spread{grid-column:2 / 4; font-size:.75rem; color:var(--muted); margin-top:-4px}

.section{margin-top:26px}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px}
.link{background:none; border:0; color:var(--accent); font-weight:600; padding:0; min-height:44px}
.inline{background:none; border:0; color:var(--accent); font-weight:600; padding:0; font-size:inherit; text-decoration:underline; text-underline-offset:2px}
.todos{display:flex; flex-wrap:wrap; gap:8px; margin:-8px 0 18px}
.todo{min-height:40px; border-radius:999px; padding:0 14px; border:1px solid var(--accent); background:var(--surface); color:var(--accent); font-weight:600; font-size:.88rem}
.todo.warn{border-color:var(--warn); color:var(--warn)}
.partial{text-align:center; font-size:.8rem; color:var(--warn); margin:-8px 0 12px}
.row .meter{position:relative}
.avgmark{position:absolute; top:-3px; width:2px; height:10px; background:var(--ink); border-radius:1px; transform:translateX(-1px)}
.under{color:var(--good); font-weight:600}
.row .spread .over{font-weight:600}
.monthhead{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:24px 2px 0; padding-bottom:6px; border-bottom:2px solid var(--line)}
.monthhead b{font-size:1.05rem}
.monthhead span{font-size:.8rem; color:var(--muted); text-align:right}
.networth{text-align:center; margin:4px 0 16px}
.networth span{display:block; color:var(--muted); font-size:.9rem}
.networth strong{font-size:clamp(2rem,9vw,2.6rem); font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.figures.eq em{display:block; font-style:normal; font-size:.75rem; color:var(--muted)}
.form{display:grid; gap:12px; margin:10px 0}
.form label{display:grid; gap:4px; font-size:.85rem; color:var(--muted)}
.form label.check{display:flex; color:var(--ink); font-size:.95rem}
.form input:not([type=checkbox]),.form select{min-height:46px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font-size:1rem}
.btn.danger{color:var(--bad)}
.status li{display:flex; justify-content:space-between; gap:10px; padding:11px 14px; font-size:.9rem}
.status li span:first-child{color:var(--muted)}
.warn{color:var(--warn); font-weight:600}
.budget-row .bar{position:relative; overflow:visible}
.tempo{position:absolute; top:-4px; width:2px; height:16px; background:var(--ink); border-radius:1px; transform:translateX(-1px)}
.back{background:none; border:0; color:var(--accent); font-weight:600; padding:0; min-height:44px; margin-bottom:4px}

.banner{display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px dashed var(--warn); border-radius:14px; padding:12px 14px; margin-bottom:18px}
.banner b{color:var(--warn)}

/* Månedsstolper */
.bars{display:block; width:100%; height:auto; background:var(--surface); border:1px solid var(--line); border-radius:14px}
.bars .hit{fill:transparent; cursor:pointer}
.bars text{font-size:10px; fill:var(--muted); font-family:inherit}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.8rem; color:var(--muted); margin-top:6px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}

/* Transaksjoner */
.search{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface)}
.chips{display:flex; gap:8px; overflow-x:auto; padding:10px 0 4px; scrollbar-width:none}
.chip{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:0 15px; min-height:44px; font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.day{font-size:.8rem; color:var(--muted); margin:16px 2px 6px}
.tx{display:grid; grid-template-columns:1fr auto; gap:2px 12px; width:100%; text-align:left; background:none; border:0; padding:11px 14px}
.tx .who{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tx .amt{font-weight:700; text-align:right}
.tx .cat{font-size:.8rem; color:var(--muted); display:flex; align-items:center; gap:6px; overflow:hidden; white-space:nowrap}
.tx .cat .dot{width:8px; height:8px; border-radius:3px; flex:none}
.tx .flag{font-size:.72rem; border:1px solid var(--line); border-radius:6px; padding:0 5px}
.tx.ukat .cat{color:var(--warn); font-weight:600}
.filterbar{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; margin-top:10px}
.filterbar .top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.filterbar .top b{font-size:.95rem}
.filterbar .close{border:0; background:none; color:var(--accent); font-weight:600; padding:6px 4px; white-space:nowrap}
.filterbar .period{margin:6px 0 2px}
.filterbar .period .label{font-size:1.05rem}
.filterbar .sum{text-align:center; font-size:1.5rem; font-weight:800}
.filterbar .cmp{text-align:center; font-size:.85rem; color:var(--muted)}
.more{display:block; margin:14px auto 0; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 16px}

/* Budsjett */
.budget-row{padding:14px; display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center}
.budget-row .bar{grid-column:1 / 3; height:8px; background:var(--line); border-radius:4px; overflow:hidden}
.budget-row .bar i{display:block; height:100%; border-radius:4px; max-width:100%}
.budget-row input{width:104px; text-align:right; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg)}
.budget-row .meta{grid-column:1 / 3; font-size:.8rem; color:var(--muted); display:flex; justify-content:space-between; gap:8px}
.over{color:var(--bad); font-weight:600}

/* Knapper */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; padding:12px 16px; border:1px solid var(--line); background:var(--surface); font-weight:600}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.stack > * + *{margin-top:10px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px}
.empty{text-align:center; padding:48px 12px}
.empty h2{font-size:1.4rem; margin-bottom:8px}
.rule{display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:10px 14px; align-items:center}
.rule button{border:0; background:none; color:var(--bad); padding:8px}
label.check{display:flex; gap:10px; align-items:flex-start; padding:8px 0}
label.check input{width:20px; height:20px; margin-top:2px; accent-color:var(--accent)}

/* Bunnmeny */
nav.tabs{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(6,1fr); padding-bottom:env(safe-area-inset-bottom,0px); z-index:10}
nav.tabs button{border:0; background:none; padding:10px 2px 12px; font-size:.72rem; min-width:0; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px}
nav.tabs button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink); font-weight:700}
.badge{background:var(--warn); color:#fff; border-radius:999px; font-size:.65rem; padding:0 5px; margin-left:2px}

/* Ark */
.overlay{position:fixed; inset:0; background:rgba(10,25,30,.45); z-index:20; display:none}
.overlay.open{display:block}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--surface); border-radius:20px 20px 0 0;
  box-shadow:var(--sheet-shadow); max-height:88%; overflow:auto; padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%); visibility:hidden; transition:transform .22s ease-out, visibility 0s linear .22s; max-width:640px; margin:0 auto}
.sheet.open{transform:none; visibility:visible; transition:transform .22s ease-out}
.grip{width:40px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 12px}
.sheet .amount{font-size:1.6rem; font-weight:800}
.details{font-size:.82rem; color:var(--muted); background:var(--bg); border-radius:10px; padding:8px 10px; margin:10px 0; word-break:break-word}
.maincats{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:10px 0}
.maincats button{display:flex; align-items:center; gap:8px; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); text-align:left; font-size:.9rem}
.maincats button[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); font-weight:700}
.subcats{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px}
.sheet-actions{display:grid; grid-template-columns:1fr 2fr; gap:10px; margin-top:12px; position:sticky; bottom:calc(-16px - env(safe-area-inset-bottom,0px)); background:var(--surface); padding:10px 0 16px}
.vh{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; clip:rect(0 0 0 0)}
.match{border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:.9rem}
.match .btns{display:flex; gap:8px; margin-top:8px}
.match .btns .btn{padding:8px 12px; font-size:.9rem}
textarea.paste{width:100%; min-height:180px; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--bg); font-size:.8rem}
.toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:10px 16px; border-radius:12px; z-index:30; font-size:.9rem; max-width:90%; opacity:0; transition:opacity .2s; pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ .sheet,.toast,.donut .seg{transition:none} }
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs" aria-label="Hovedmeny">
  <button data-tab="oversikt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 5"/></svg>Oversikt</button>
  <button data-tab="snitt"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 8-9"/><path d="M3 12h18" stroke-dasharray="2 3"/></svg>Snitt</button>
  <button data-tab="tx"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg><span>Poster<span id="ukBadge"></span></span></button>
  <button data-tab="budsjett"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Budsjett</button>
  <button data-tab="formue"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6M5 10v9M19 10v9M9.5 10v9M14.5 10v9M3 21h18"/></svg>Formue</button>
  <button data-tab="data"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Import</button>
</nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Velg kategori"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileCsv" class="vh" accept=".csv,text/csv,text/comma-separated-values,text/plain,*/*" multiple tabindex="-1">
<input type="file" id="fileBackup" class="vh" accept=".json,application/json,*/*" tabindex="-1">

<script>
// ===== Kjernelogikk: parsing, kategorier, regler =====
const CATS = {
  bolig:      { name: 'Bolig', color: '#2F5D8A', type: 'exp', subs: { laan: 'Boliglån (renter og gebyr)', felles: 'Felleskostnader', strom: 'Strøm', forsikring: 'Innbo- og reiseforsikring', kommunal: 'Kommunale avgifter', annet: 'Annet' } },
  mat:        { name: 'Mat & drikke', color: '#3F8A5A', type: 'exp', subs: { dagligvarer: 'Dagligvarer', restaurant: 'Restaurant', takeaway: 'Take-away & gatekjøkken', kafe: 'Kafé, bakeri & kiosk', bar: 'Bar & uteliv', alkohol: 'Vinmonopolet' } },
  transport:  { name: 'Transport', color: '#C9722F', type: 'exp', subs: { drivstoff: 'Drivstoff & lading', parkering: 'Parkering', bom: 'Bom & ferje', kollektiv: 'Kollektiv', sparkesykkel: 'Sparkesykkel', vedlikehold: 'Service, vask & deler', dekk: 'Dekk', avgifter: 'Bilavgifter', bilkjop: 'Bilkjøp', billan: 'Billån', bilforsikring: 'Bilforsikring', bilapp: 'Bilapp & tilkobling' } },
  abonnement: { name: 'Abonnementer', color: '#7B4F9E', type: 'exp', subs: { strommetjenester: 'Strømmetjenester', mobil: 'Mobil & internett', programvare: 'Programvare & AI', apper: 'Apper', nyheter: 'Nyheter', bank: 'Bank- og kortgebyr' } },
  shopping:   { name: 'Shopping', color: '#B4464B', type: 'exp', subs: { elektronikk: 'Elektronikk', klaer: 'Klær & sko', interior: 'Møbler & interiør', sport: 'Sport & friluft', bygg: 'Bygg & verktøy', diverse: 'Diverse' } },
  helse:      { name: 'Helse & velvære', color: '#23918F', type: 'exp', subs: { apotek: 'Apotek', lege: 'Lege, tannlege & sykehus', trening: 'Trening', pleie: 'Frisør & pleie' } },
  fritid:     { name: 'Fritid', color: '#CFA02B', type: 'exp', subs: { spill: 'Spill', tipping: 'Tipping', opplevelser: 'Kino & opplevelser', hobby: 'Hobby', reise: 'Reise' } },
  utdanning:  { name: 'Utdanning', color: '#5873B8', type: 'exp', subs: { semester: 'Semesteravgift', annet: 'Kurs & annet' } },
  gaver:      { name: 'Gaver', color: '#D0678F', type: 'exp', subs: { gaver: 'Gaver', blomster: 'Blomster' } },
  finans:     { name: 'Gjeld', color: '#8C4A3C', type: 'exp', subs: { studielan: 'Studielån', kreditt: 'Kredittkort', forbrukslan: 'Forbrukslån', faktura: 'Delbetaling (Klarna, Riverty o.l.)', annetlan: 'Annen gjeld' } },
  inntekt:    { name: 'Inntekt', color: '#2E7D4F', type: 'inc', subs: { lonn: 'Lønn', refusjon: 'Refusjon', skatt: 'Skatt tilbake', annet: 'Annen inntekt' } },
  overforing: { name: 'Overføringer', color: '#7D8B90', type: 'transfer', subs: { personer: 'Venner & familie', sparing: 'Sparing & investering', egne: 'Egne kontoer' } },
  ukat:       { name: 'Ukategorisert', color: '#A3ADB0', type: 'auto', subs: { ukat: 'Ukategorisert' } },
};

// Nøkkelord -> kategori. Rekkefølgen betyr noe: spesifikke regler først.
// '*' i starten/slutten = ingen ordgrense på den siden.
const KEYWORD_RULES = [
  // Inntekt / refusjon (retning sjekkes i categorize)
  ['+', ['HELFO', 'NAV'], 'inntekt/refusjon'],
  ['+', ['SKATTEETATEN', 'SKATTEINNKREVIN*'], 'inntekt/skatt'],
  ['+', ['UNIVERSITET*', 'HØGSKOLE*'], 'inntekt/refusjon'],
  ['+', ['COOP SØRVEST', 'COOP'], 'inntekt/annet'],
  ['+', ['NORDNET'], 'overforing/sparing'],
  ['-', ['CRYPTO', 'NORDNET', 'FIRI'], 'overforing/sparing'],
  // Bolig
  ['-', ['*BOLIGBYGGELAG', 'FELLESKOSTNADER*', 'FELLESUTGIFTER*', 'BORETTSLAG', 'SAMEIE*'], 'bolig/felles'],
  ['-', ['LYSE MARKED', 'LYSE DIALOG', 'TIBBER', 'FJORDKRAFT', 'ELVIA'], 'bolig/strom'],
  ['-', ['NITO FORSIKRING'], 'bolig/forsikring'],
  ['-', ['TRYG', 'GJENSIDIGE', 'IF SKADE', 'FREMTIND', 'STOREBRAND'], 'transport/bilforsikring'],
  ['-', ['*KOMMUNE'], 'bolig/kommunal'],
  ['-', ['FORUS GJENVINNI*', 'IVAR'], 'bolig/annet'],
  // Transport (spesifikke før generelle)
  ['-', ['OMREG*', 'OMREGISTRERING*', 'TRAFIKKFORSIKRINGSAVGIFT'], 'transport/avgifter'],
  ['-', ['KIA CONNECT', 'TESLA APP'], 'transport/bilapp'],
  ['-', ['UNO-X', 'CIRCLE K', 'ESSO', 'SHELL', 'ST1', 'YX', 'ELTON MOBILITY', 'RECHARGE', 'IONITY', 'MER NORWAY', 'FORTUM', 'KEMPOWER', 'TESLA SUPERCHARGER'], 'transport/drivstoff'],
  ['-', ['APCOA', 'EASYPARK', 'ONEPARK', 'AIMO', 'PARKERING*'], 'transport/parkering'],
  ['-', ['FERDE', 'AUTOSYNC', 'AUTOPASS', 'FJORD1', 'NORLED'], 'transport/bom'],
  ['-', ['KOLUMBUS', 'VY', 'ENTUR', 'RUTER', 'FLYBUSS*'], 'transport/kollektiv'],

const MIGRATIONS = { 2: { 'finans/gebyr': 'abonnement/bank', 'utdanning/studielan': 'finans/studielan' }, 3: {}, 4: {} };
function migrate() {
  let v = S.v || 1, changed = false;
  while (MIGRATIONS[v + 1]) {
    const map = MIGRATIONS[v + 1];
    for (const t of S.tx) if (t.cat && map[t.cat]) t.cat = map[t.cat];
    for (const k in S.rules) if (map[S.rules[k]]) S.rules[k] = map[S.rules[k]];
    v++; changed = true;
  }
  S.v = v; return changed;
}

const ui = { tab: 'oversikt', period: null, drill: null, q: '', kind: 'alle', cat: null, limit: 60, sheet: null, sheetMain: null };

// ===== Kategori-hjelpere =====
const autoMemo = new Map();

}
function matchOf(t) { return (t.cat || S.rules[t.key]) ? null : matches().get(t.id) || null; }
function catOf(t) { if (t.cat) return t.cat; if (S.rules[t.key]) return S.rules[t.key]; const m = matches().get(t.id); return m ? m.cat : autoOf(t); }
function sourceOf(t) { return t.cat ? (t.link ? 'bekreftet' : 'manuell') : S.rules[t.key] ? 'lært' : matchOf(t) ? 'antatt' : 'auto'; }
// Innbetalinger fra venner koblet til et kjøp (antatte + bekreftede)
function refundsFor(p) {

  for (const t of S.tx) {
    if (t.link === p.id) out.push({ t, confirmed: true });
    else { const m = matchOf(t); if (m && m.purchaseId === p.id) out.push({ t, confirmed: false }); }
  }

}
function refundIndex() {

}
function pendingCount() { let n = 0; for (const t of S.tx) if (matchOf(t)) n++; return n; }
function mainOf(cat) { return cat.split('/')[0]; }
function catLabel(cat) { const [m, s] = cat.split('/'); const M = CATS[m]; if (!M) return cat; return m === 'ukat' ? M.name : M.name + ' · ' + (M.subs[s] || s); }
function kindOf(t, cat = catOf(t)) {
  const ty = CATS[mainOf(cat)]?.type || 'auto';
  return ty === 'auto' ? (t.amount < 0 ? 'exp' : 'inc') : ty;
}
const CITY_END = /\s+(oslo|bergen|trondheim|stavanger|sandnes|drammen|kristiansand|tromsø|fredrikstad|sarpsborg|skien|ålesund|bodø|haugesund|tønsberg|moss|arendal|hamar|larvik|halden|lillehammer|molde|harstad|gjøvik|porsgrunn|kongsberg|sola|bryne|klepp|randaberg|asker|bærum|lillestrøm|ski|gardermoen|hafrsfjord)$/i;
function autoName(t) {

  if (/^overføring$/i.test(s.trim())) { const v = vippsName(t.msg); s = v ? 'Vipps fra ' + v : 'Overføring'; }
  s = s.replace(/\s*\(\d{11}\)\s*/g, ' ').replace(/^\d{2}\.\d{2}\s+/, '').replace(/\s+/g, ' ').trim();
  if (/nedbetaling av lån/i.test(t.sub) || /^til konto:/i.test(s)) {

  if (s === s.toUpperCase()) s = s.toLowerCase().replace(/(^|[\s\-/.])([a-zæøå])/g, (m, a, b) => a + b.toUpperCase());

}
function niceName(t) { return (S.names && S.names[t.key]) || autoName(t); }

// ===== Perioder =====
let monthsCache = null;
function monthsInData() {
  if (!monthsCache) monthsCache = [...new Set(S.tx.map(t => t.date.slice(0, 7)))].sort();
  return monthsCache;
}
function addMonths(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${String(m).padStart(2, '0')}`; }
function monShort(ym) { return MONTHS[+ym.slice(5) - 1].slice(0, 3) + ' ' + ym.slice(2, 4); }
function periodLabel(p) {
  if (p === '12m') return 'Siste 12 måneder';
  if (p.startsWith('r:')) { const [, a, b] = p.split(':'); return a === b ? periodLabel(a) : `${monShort(a)} – ${monShort(b)}`; }
  const [y, m] = p.split('-'); return MONTHS[+m - 1] + ' ' + y;
}
function inPeriod(t, p) {
  if (p === '12m') { const last = monthsInData().at(-1); return t.date.slice(0, 7) > addMonths(last, -12); }
  if (p.startsWith('r:')) { const [, a, b] = p.split(':'), ym = t.date.slice(0, 7); return ym >= a && ym <= b; }
  return t.date.startsWith(p);
}
function periodMonths(p) {
  if (p === '12m') return Math.min(12, monthsInData().length);
  if (p.startsWith('r:')) { const [, a, b] = p.split(':'); let n = 1, m = a; while (m < b) { m = addMonths(m, 1); n++; } return n; }
  return 1;
}
// Hvilke datoer importerte filer dekker (fra bunnteksten i CSV-en)
function addCoverage(from, to) {
  const list = [...(S.coverage || []), [from, to]].sort((x, y) => x[0].localeCompare(y[0])), out = [];
  for (const r of list) {
    const last = out.at(-1);
    if (last && Date.parse(r[0]) <= Date.parse(last[1]) + 864e5) { if (r[1] > last[1]) last[1] = r[1]; }
    else out.push([...r]);
  }
  S.coverage = out;
}
function monthEnd(ym) { const [y, m] = ym.split('-').map(Number); return `${ym}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`; }
// Hele måneder = måneder der importen dekker fra 1. til siste dag
function completeMonths() {
  let cov = S.coverage && S.coverage.length ? S.coverage : null;
  if (!cov) { const d = S.tx.map(t => t.date).sort(); cov = d.length ? [[d[0], d.at(-1)]] : []; }
  return monthsInData().filter(m => cov.some(([a, b]) => a <= m + '-01' && b >= monthEnd(m)));
}
function avgWindow(n) { const all = completeMonths(); return n === 'alle' ? all : all.slice(-n); }
function averages(months) {
  const r = { inc: 0, exp: 0, transfer: 0, byMain: {}, bySub: {}, perMonth: [], hidden: 0, hiddenSum: 0 };
  const k = months.length || 1, opt = { noOneoff: !S.settings.oneoffInAvg };
  for (const m of months) {
    const t = totals(m, opt); r.perMonth.push({ m, t }); r.hidden += t.hidden; r.hiddenSum += t.hiddenSum;
    r.inc += t.inc / k; r.exp += t.exp / k; r.transfer += t.transfer / k;
    for (const [c, v] of Object.entries(t.byMain)) r.byMain[c] = (r.byMain[c] || 0) + v / k;
    for (const [c, v] of Object.entries(t.bySub)) r.bySub[c] = (r.bySub[c] || 0) + v / k;
  }
  return r;
}
let avgCache = null;
function currentAverages() { if (!avgCache) avgCache = averages(avgWindow(S.settings.avgN || 6)); return avgCache; }

// ===== Aggregering =====
// opt.noOneoff: hopp over engangsposter (brukes i snitt). Månedsvisning tar dem alltid med.
function totals(p, opt = {}) {
  const res = { inc: 0, exp: 0, transfer: 0, byMain: {}, bySub: {}, hidden: 0, hiddenSum: 0, oneoffs: [] };
  for (const t of S.tx) {
    if (!inPeriod(t, p)) continue;
    if (t.oneoff && opt.noOneoff) { res.hidden++; res.hiddenSum += -t.amount; continue; }
    if (t.oneoff) res.oneoffs.push(t);
    const cat = catOf(t), k = kindOf(t, cat);
    if (k === 'inc') res.inc += t.amount;
    else if (k === 'transfer') res.transfer += t.amount;
    else {
      const v = -t.amount; res.exp += v;
      const m = mainOf(cat); res.byMain[m] = (res.byMain[m] || 0) + v;
      res.bySub[cat] = (res.bySub[cat] || 0) + v;
    }
  }
  return res;
}
// Datoer dataene dekker, og om en måned er ufullstendig
function dataSpan() {
  const cov = S.coverage && S.coverage.length ? S.coverage : null;
  if (cov) return { from: cov[0][0], to: cov.reduce((a, c) => c[1] > a ? c[1] : a, cov[0][1]) };
  const d = S.tx.map(t => t.date).sort(); return { from: d[0], to: d.at(-1) };
}
function partialNote(m) {
  if (!m || m.length !== 7 || completeMonths().includes(m)) return '';
  const sp = dataSpan();
  if (sp.to && sp.to < monthEnd(m)) return `Påbegynt måned, data til ${shortDate(sp.to)}`;
  if (sp.from && sp.from > m + '-01') return `Ufullstendig måned, data fra ${shortDate(sp.from)}`;
  return 'Ufullstendig måned';
}
function daysSince(iso) { return iso ? Math.floor((Date.now() - Date.parse(iso)) / 864e5) : null; }
function bigTransfers() { return S.tx.filter(t => isPersonTransfer(t) && t.amount <= -5000 && !t.cat && !S.rules[t.key]); }
function monthDiff(a, b) { return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); }
function median(a) { const s = [...a].sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0; }

// ===== Faste utgifter: gjentakende regninger i «faste» kategorier =====
const FIXED_MAINS = new Set(['bolig', 'finans', 'abonnement']);
const FIXED_CATS = new Set(['transport/billan', 'transport/bilforsikring', 'transport/bilapp', 'utdanning/semester', 'helse/trening']);
function fixedCosts() {
  const groups = new Map();
  for (const t of S.tx) {
    if (t.amount >= 0 || t.oneoff) continue;
    const cat = catOf(t);
    if (kindOf(t, cat) !== 'exp' || !(FIXED_MAINS.has(mainOf(cat)) || FIXED_CATS.has(cat))) continue;
    const g = groups.get(t.key) || { key: t.key, tx: [] }; g.tx.push(t); g.cat = cat; groups.set(t.key, g);
  }
  const endM = (dataSpan().to || '').slice(0, 7), out = [];
  for (const g of groups.values()) {
    const byM = new Map();
    for (const t of g.tx) { const m = t.date.slice(0, 7); byM.set(m, (byM.get(m) || 0) - t.amount); }
    const ms = [...byM.keys()].sort(); if (ms.length < 2) continue;
    const gaps = []; for (let i = 1; i < ms.length; i++) gaps.push(monthDiff(ms[i - 1], ms[i]));
    const every = [1, 2, 3, 6, 12].reduce((best, x) => Math.abs(x - median(gaps)) < Math.abs(best - median(gaps)) ? x : best, 1);
    const okGaps = gaps.filter(x => Math.abs(x - every) <= Math.max(1, every * .34)).length;
    if (okGaps / gaps.length < .7) continue;
    if (every === 1 && ms.length < 3) continue;
    if (monthDiff(ms.at(-1), endM) > every + 1) continue; // ser ut til å ha stoppet
    const last = g.tx.reduce((a, t) => t.date > a.date ? t : a, g.tx[0]);
    out.push({ key: g.key, cat: g.cat, name: niceName(last), every, perMonth: median([...byM.values()]) / every });
  }
  return out.sort((a, b) => b.perMonth - a.perMonth);
}
function uncategorizedCount() { return S.tx.filter(t => catOf(t) === 'ukat/ukat').length; }

// ===== Grafer =====
function donutSVG(items, label) {
  const total = items.reduce((a, b) => a + b.value, 0);
  const R = 78, C = 2 * Math.PI * R; let off = 0;
  const segs = items.map(it => {
    const len = it.value / total * C, gap = items.length > 1 ? 1.5 : 0;
    const s = `<circle class="seg" data-id="${esc(it.id)}" r="${R}" cx="100" cy="100" fill="none" stroke="${it.color}" stroke-width="26"
      stroke-dasharray="${Math.max(len - gap, .6).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 100 100)"><title>${esc(it.label)}: ${kr(it.value)}</title></circle>`;
    off += len; return s;
  }).join('');
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="${esc(label)}">
    <circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--line)" stroke-width="26"/>${segs}</svg>`;
}
function barsSVG(active) {
  const months = monthsInData(); if (!months.length) return '';
  const last = months.at(-1), list = []; for (let i = 11; i >= 0; i--) list.push(addMonths(last, -i));
  const data = list.map(m => { const t = totals(m); return { m, inc: t.inc, exp: t.exp }; });
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const W = 340, H = 150, top = 12, bottom = 22, colW = W / 12, bw = colW * .3, h = H - top - bottom;
  const out = data.map((d, i) => {
    const x = i * colW + colW / 2, hi = d.inc / max * h, he = d.exp / max * h, act = d.m === active;
    return `<g>${act ? `<rect x="${i * colW + 1}" y="2" width="${colW - 2}" height="${H - 4}" rx="6" fill="var(--bg)"/>` : ''}
      <g opacity="${partialNote(d.m) ? .4 : 1}"><rect x="${x - bw - 1}" y="${top + h - hi}" width="${bw}" height="${Math.max(hi, .5)}" rx="2" fill="var(--good)"/>
      <rect x="${x + 1}" y="${top + h - he}" width="${bw}" height="${Math.max(he, .5)}" rx="2" fill="var(--accent)"/></g>
      <text x="${x}" y="${H - 7}" text-anchor="middle" ${act ? 'style="fill:var(--ink);font-weight:700"' : ''}>${MONTHS[+d.m.slice(5) - 1].slice(0, 3)}</text>
      <rect class="hit" data-month="${d.m}" x="${i * colW}" y="0" width="${colW}" height="${H}"><title>${periodLabel(d.m)}: inn ${kr(d.inc)}, ut ${kr(d.exp)}</title></rect></g>`;
  }).join('');
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Inntekter og utgifter per måned">${out}</svg>
    <div class="legend"><span><i style="background:var(--good)"></i>Inn</span><span><i style="background:var(--accent)"></i>Ut</span><span>Lysere = ufullstendig måned. Trykk for å åpne.</span></div>`;
}

// ===== Visninger =====

function todoRow() {

}

  if (bits.length) html += `<p class="muted small" style="margin-top:10px">${bits.join(' ')}</p>`;
  html += `<div class="section"><div class="section-head"><h2>Måned for måned</h2></div>${barsSVG(p)}</div>`;

// avg: kart id -> snitt per måned. done: måneden er ferdig, så avvik kan vises.
function listRows(items, total, mode, avg, done) {
  return `<ul class="list">${items.map(x => {
    const a = avg ? avg[x.id] || 0 : null, diff = a != null ? x.value - a : 0;
    const cmp = a == null ? '' : `<span class="spread">Snitt ${kr(a)}${done && a > 0 && Math.abs(diff) >= Math.max(50, a * .1) ? ` · <span class="${diff > 0 ? 'over' : 'under'}">${kr(Math.abs(diff))} ${diff > 0 ? 'over' : 'under'}</span>` : ''}</span>`;
    const mark = a ? `<b class="avgmark" style="left:${Math.min(100, a / total * 100).toFixed(1)}%"></b>` : '';
    return `<li><button class="row" ${mode === 'main' ? `data-drill="${x.id}"` : `data-showcat="${x.id}"`}>
    <span class="dot" style="background:${x.color}"></span>
    <span class="name">${esc(x.label)}<span class="pct">${Math.round(x.value / total * 100)} %</span></span>
    <span class="num">${kr(x.value)}</span>
    <span class="meter"><i style="width:${(x.value / total * 100).toFixed(1)}%;background:${x.color}"></i>${mark}</span>${cmp}</button></li>`;
  }).join('')}</ul>`;
}
function shadeList(hex, n) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  return Array.from({ length: n }, (_, i) => {
    const f = n <= 1 ? 0 : i / (n - 1) * .6 - .15;
    const mix = c => Math.round(f >= 0 ? c + (255 - c) * f : c * (1 + f));
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  });
}

let refundIndex_ = new Map();
function filteredTx() {
  const q = ui.q.trim().toLowerCase();
  refundIndex_ = refundIndex();
  const bigIds = new Set(bigTransfers().map(t => t.id));
  return S.tx.filter(t => {
    const cat = catOf(t), k = kindOf(t, cat);

const WKINDS = {
  konto: { t: 'asset', name: 'Bankkonto' }, bolig: { t: 'asset', name: 'Bolig' }, bil: { t: 'asset', name: 'Bil' },
  fond: { t: 'asset', name: 'Aksjer og fond' }, annet: { t: 'asset', name: 'Annen eiendel' },
  boliglan: { t: 'debt', name: 'Boliglån', cat: 'bolig/laan' }, billan: { t: 'debt', name: 'Billån', cat: 'transport/billan' },
  studielan: { t: 'debt', name: 'Studielån', cat: 'finans/studielan' }, kreditt: { t: 'debt', name: 'Kredittkort', cat: 'finans/kreditt' },
  forbrukslan: { t: 'debt', name: 'Forbrukslån', cat: 'finans/forbrukslan' }, gjeld: { t: 'debt', name: 'Annen gjeld', cat: 'finans/annetlan' },
};
const today = () => new Date().toISOString().slice(0, 10);
function msgKr(msg, word) { const m = (msg || '').match(new RegExp(word + ':\\s*kr\\s*([\\d.\\s]+,\\d{2})', 'i')); return m ? toNum(m[1]) : null; }
function setAccountBalance(acc, bal) {
  const W = S.wealth, id = 'acct-' + (acc || 'hoved').replace(/\s/g, '');
  let it = W.items.find(x => x.id === id);
  if (!it) { it = { id, kind: 'konto', auto: true, name: 'Brukskonto' + (acc ? ' ' + acc : ''), value: 0, updated: '', history: [] }; W.items.push(it); }
  if (bal.date >= (it.updated || '')) { it.value = bal.amount; it.updated = bal.date; it.history.push({ date: bal.date, value: bal.amount }); snapWealth(); }
}
// Lån: saldo fra siste registrering, justert for avdrag på betalinger etterpå
function loanStatus(it) {
  const cat = WKINDS[it.kind]?.cat, rate = (+it.rate || 0) / 100;
  const pays = cat ? S.tx.filter(t => t.amount < 0 && catOf(t) === cat && t.date > it.updated).sort((a, b) => a.date.localeCompare(b.date)) : [];
  let bal = +it.value || 0, amort = 0, interest = 0;
  for (const p of pays) {
    const ren = msgKr(p.msg, 'Renter'), avd = msgKr(p.msg, 'Avdrag'), fee = msgKr(p.msg, 'Terminomkostninger') || 0;
    const i = ren != null ? ren : bal * rate / 12;
    const a = avd != null ? avd : it.noAmort ? 0 : Math.max(0, -p.amount - i - fee);
    bal -= a; amort += a; interest += i;
  }
  // Typisk måned: siste betaling i kategorien
  const last = cat ? S.tx.filter(t => t.amount < 0 && catOf(t) === cat).sort((a, b) => b.date.localeCompare(a.date))[0] : null;
  let mInt = bal * rate / 12, mAmort = 0, mPay = last ? -last.amount : 0;
  if (last) {
    const ren = msgKr(last.msg, 'Renter'), avd = msgKr(last.msg, 'Avdrag'), fee = msgKr(last.msg, 'Terminomkostninger') || 0;
    if (ren != null) mInt = ren;
    mAmort = avd != null ? avd : it.noAmort ? 0 : Math.max(0, mPay - mInt - fee);
  }
  return { bal: Math.max(0, bal), n: pays.length, amort, interest, mInt, mAmort, mPay };
}
// Anslag på boliglån ut fra rentebeløpene i kontoutskriften
function impliedMortgage(ratePct) {
  const r = S.tx.filter(t => catOf(t) === 'bolig/laan').sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3).map(t => msgKr(t.msg, 'Renter')).filter(x => x);
  if (!r.length || !ratePct) return null;
  return Math.round(r.reduce((a, b) => a + b, 0) / r.length * 12 / (ratePct / 100) / 1000) * 1000;
}
function itemValue(it) { return WKINDS[it.kind].t === 'debt' ? loanStatus(it).bal : +it.value || 0; }
function wealthTotals() {
  let assets = 0, debts = 0;
  for (const it of S.wealth.items) { const v = itemValue(it); if (WKINDS[it.kind].t === 'debt') debts += v; else assets += v; }
  return { assets, debts, net: assets - debts };
}
function snapWealth() {
  const W = S.wealth; if (!W.items.length) return;
  const t = wealthTotals(), d = today(), snap = { date: d, ...t };
  const i = W.snaps.findIndex(x => x.date === d);
  if (i >= 0) W.snaps[i] = snap; else W.snaps.push(snap);
  W.snaps.sort((a, b) => a.date.localeCompare(b.date));
}
function netChart() {

    ${lo < 0 ? `<line x1="${pad}" x2="${W - pad}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="3 3"/>` : ''}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.net)}" r="3" fill="var(--accent)"><title>${periodLabel(p.date.slice(0, 7))}: ${kr(p.net)}</title></circle>
      <text x="${x(i)}" y="${H - 6}" text-anchor="middle">${MONTHS[+p.date.slice(5, 7) - 1].slice(0, 3)}</text>`).join('')}</svg>`;

function viewWealth() {

  if (!W.items.length) return html + `<div class="empty" style="padding-top:24px"><p class="muted">Legg inn bolig, bil, fond og lån for å se nettoformuen din. Saldoen på brukskontoen hentes fra CSV-importen (importer filen på nytt hvis den mangler).</p>
    <div class="stack" style="max-width:320px;margin:0 auto"><button class="btn primary block" data-witem="new:asset">Legg til eiendel</button><button class="btn block" data-witem="new:debt">Legg til gjeld</button></div></div>`;
  html += `<div class="networth"><span>Nettoformue</span><strong class="${T.net >= 0 ? 'pos' : 'neg'}">${kr(T.net)}</strong></div>
    <div class="figures" style="grid-template-columns:1fr 1fr"><div><span>Eiendeler</span><strong>${kr(T.assets)}</strong></div><div><span>Gjeld</span><strong>${kr(T.debts)}</strong></div></div>`;
  // Egenkapital i bolig og bil
  const pair = (a, d, label) => {

// ===== Import / eksport =====
async function importFiles(files) {
  const items = [];
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.includes('\uFFFD')) text = new TextDecoder('windows-1252').decode(buf);
      items.push({ name: f.name, text });
    } catch (e) { items.push({ name: f.name, text: '', err: 'Kunne ikke lese filen: ' + e.message }); }
  }
  return importTexts(items);
}
async function importTexts(items) {
  const lines = [];
  for (const f of items) {
    try {
      if (f.err) throw new Error(f.err);
      const { tx, skipped, reserved, coverage } = parseBankCSV(f.text);
      if (coverage.from && coverage.to) addCoverage(coverage.from, coverage.to);
      if (coverage.balance) setAccountBalance(coverage.account, coverage.balance);
      const { added, dupes } = mergeTx(S.tx, tx);
      if (!S.owner) S.owner = detectOwner(tx);
      for (const t of added) t.key = merchantKey(t);
      S.tx.push(...added); S.lastImport = new Date().toISOString();
      const uk = added.filter(t => catOf(t) === 'ukat/ukat').length;
      lines.push(`<b>${esc(f.name)}</b>: ${added.length} nye, ${dupes} fantes fra før${reserved ? `, ${reserved} reservert (venter)` : ''}${uk ? `. <b>${uk}</b> trenger kategori.` : '.'}`);
    } catch (e) { lines.push(`<b>${esc(f.name)}</b>: <span class="neg">${esc(e.message)}</span>`); }
  }
  snapWealth(); save();
  const months = monthsInData(); if (!ui.period || !months.includes(ui.period) && ui.period !== '12m') ui.period = months.at(-1);
  render();
  const box = document.getElementById('importResult');
  if (box) box.innerHTML = `<div class="details" style="color:var(--ink)">${lines.join('<br>')}</div>`;
  else toast('Import ferdig');
}
async function exportBackup() {
  const data = JSON.stringify({ app: 'budsjett', version: 1, exported: new Date().toISOString(), ...S });
  const name = `budsjett-backup-${new Date().toISOString().slice(0, 10)}.json`;
  try {
    const dl = window.claude?.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: name, data }); S.lastBackup = new Date().toISOString(); save(); render(); toast('Sikkerhetskopi lagret'); return; }
  } catch (e) { if (e?.code === 'declined') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  S.lastBackup = new Date().toISOString(); save(); render();
}
async function restoreBackup(f) {
  try {
    const s = JSON.parse(await f.text());
    if (!Array.isArray(s.tx)) throw new Error('Filen er ikke en sikkerhetskopi fra denne appen.');
    if (!confirm(`Erstatte dagens data med ${s.tx.length} transaksjoner fra sikkerhetskopien?`)) return;
    S = { ...blank(), tx: s.tx, rules: s.rules || {}, budgets: s.budgets || {}, settings: { ...blank().settings, ...(s.settings || {}) }, owner: s.owner || '', coverage: s.coverage || [], v: s.v || 1, names: s.names || {}, lastImport: s.lastImport || null, lastBackup: s.lastBackup || null, wealth: s.wealth || { items: [], snaps: [] } };
    migrate();
    autoMemo.clear(); save(); ui.period = monthsInData().at(-1) || null; render(); toast('Sikkerhetskopi gjenopprettet');
  } catch (e) { toast(e.message); }
}

  if (d.wuse) { document.getElementById('wValue').value = d.wuse; return; }
  if ('wdelete' in d) { if (confirm('Slette denne posten fra formuen?')) { S.wealth.items = S.wealth.items.filter(x => x.id !== ui.wid); snapWealth(); save(); closeSheet(); render(); } return; }
  if ('bigtx' in d) { const b = bigTransfers(); if (b.length === 1) return openSheet(b[0].id); ui.kind = 'stor'; ui.cat = null; ui.q = ''; return go('tx'); }
  if ('keeptransfer' in d) { const t = S.tx.find(x => x.id === ui.sheet); if (t) { t.cat = 'overforing/personer'; save(); toast('Beholdt som overføring'); } closeSheet(); return render(); }
  if ('rename' in d) {
    const t = S.tx.find(x => x.id === ui.sheet); if (!t) return;
    const n = S.tx.filter(x => x.key === t.key).length;
    const v = prompt(`Nytt navn${n > 1 ? ` for alle ${n} fra «${t.key.slice(2)}»` : ''} (tomt = automatisk):`, niceName(t));
    if (v === null) return;
    S.names = S.names || {};
    if (v.trim()) S.names[t.key] = v.trim(); else delete S.names[t.key];
    save(); renderSheet(); return render();
  }
  if (d.delname) { delete S.names[d.delname]; save(); return render(); }
  if (d.fixedq) { ui.q = d.fixedq; ui.kind = 'alle'; ui.cat = null; return go('tx'); }
  if (d.budperiod) { ui.period = d.budperiod; return render(); }
  if (d.avgn) { S.settings.avgN = d.avgn === 'alle' ? 'alle' : +d.avgn; save(); return render(); }
  if ('avgdrill' in d) { ui.avgDrill = d.avgdrill || null; render(); return window.scrollTo(0, 0); }
  if (d.showcat && d.range) { ui.cat = d.showcat; ui.period = d.range; ui.kind = 'alle'; ui.q = ''; return go('tx'); }
  if (d.txperiod) { ui.period = d.txperiod; ui.limit = 60; return render(); }
  if ('toggle12' in d) { ui.period = ui.period === '12m' ? monthsInData().at(-1) : '12m'; return render(); }
  if (d.month) { ui.period = d.month; return render(); }
  if (el.matches('circle.seg') && ui.tab === 'snitt') {
    const ms = avgWindow(S.settings.avgN || 6), rng = 'r:' + ms[0] + ':' + ms.at(-1);
    if (!ui.avgDrill) { ui.avgDrill = d.id; return render(); }
    ui.cat = d.id; ui.period = rng; ui.kind = 'alle'; ui.q = ''; return go('tx');
  }
  if (el.matches('circle.seg')) {
    if (!ui.drill) { ui.drill = d.id; return render(); }
    ui.cat = d.id; ui.kind = 'alle'; ui.q = ''; return go('tx');
  }
  if ('drill' in d) { ui.drill = d.drill || null; render(); return window.scrollTo(0, 0); }
  if (d.showcat) { ui.cat = d.showcat; ui.kind = 'alle'; ui.q = ''; return go('tx'); }
  if ('gotoPending' in d) { ui.kind = 'antatt'; ui.cat = null; ui.q = ''; return go('tx'); }
  if ('mconfirm' in d) { const t = S.tx.find(x => x.id === ui.sheet), m = matchOf(t); if (m) { t.cat = m.cat; if (m.purchaseId) t.link = m.purchaseId; save(); toast('Bekreftet'); } closeSheet(); return render(); }
  if ('mreject' in d) { const t = S.tx.find(x => x.id === ui.sheet), m = matchOf(t); if (m) { t.rejected = [...(t.rejected || []), m.purchaseId]; save(); const n = matchOf(t); toast(n?.purchaseId ? 'Fant et annet mulig kjøp' : 'Koblingen er fjernet'); } return n2(); }
  if ('paste' in d) return openPaste();
  if ('pasteImport' in d) { const v = document.getElementById('pasteBox').value; if (!v.trim()) return toast('Lim inn innholdet i CSV-filen først'); closeSheet(); ui.tab = 'data'; render(); return importTexts([{ name: 'Innlimt tekst', text: v }]); }
  if ('gotoUkat' in d) { ui.kind = 'ukat'; ui.cat = null; ui.q = ''; return go('tx'); }
  if (d.kind) { ui.kind = d.kind; ui.limit = 60; return render(); }
  if ('clearcat' in d) { ui.cat = null; return render(); }
  if ('more' in d) { ui.limit += 100; return render(); }
  if (d.tx) return openSheet(d.tx);
  if (d.smain) { ui.sheetMain = d.smain; const subs = Object.keys(CATS[d.smain].subs); ui.sheetCat = subs.length === 1 ? d.smain + '/' + subs[0] : null; return renderSheet(); }
  if (d.ssub) { ui.sheetCat = d.ssub; return renderSheet(); }
  if ('ssave' in d) return saveSheet();
  if ('sclose' in d) return closeSheet();
  if ('sreset' in d) { const t = S.tx.find(x => x.id === ui.sheet); if (t) { delete t.cat; delete t.link; save(); } closeSheet(); return render(); }
  if ('export' in d) return exportBackup();
  if ('wipe' in d) { if (confirm('Slette alle transaksjoner, regler og budsjett på denne enheten?')) { S = blank(); autoMemo.clear(); save(); render(); toast('Alle data er slettet'); } return; }
  if (d.delrule) { delete S.rules[d.delrule]; save(); return render(); }
  if ('fillbudget' in d) {
    const acc = currentAverages().byMain;
    let n = 0; for (const [k, v] of Object.entries(acc)) if (!S.budgets[k] && v > 0 && k !== 'ukat') { S.budgets[k] = Math.ceil(v / 100) * 100; n++; }
    save(); render(); return toast(n ? `Fylte inn ${n} mål, rundet opp til nærmeste hundrelapp.` : 'Alle felt har allerede et mål.');
  }
});
document.getElementById('overlay').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) closeSheet(); });
document.addEventListener('input', e => {
  if (e.target.id === 'wRate') return wealthHint();
  if (e.target.matches('[data-search]')) {
    ui.q = e.target.value; ui.limit = 60; const pos = e.target.selectionStart; render();
    const s = document.querySelector('[data-search]'); s.focus(); s.setSelectionRange(pos, pos);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'wKind') { const n = document.getElementById('wName'); return wealthHint(); }
  if (el.dataset.budget) { const v = parseInt(el.value.replace(/\D/g, ''), 10); if (v) S.budgets[el.dataset.budget] = v; else delete S.budgets[el.dataset.budget]; save(); render(); }
  if (el.dataset.setting) { S.settings[el.dataset.setting] = el.checked; save(); render(); }
  if ('darktoggle' in el.dataset) { document.documentElement.dataset.theme = el.checked ? 'dark' : 'light'; S.settings.theme = document.documentElement.dataset.theme; save(); applyThemeColor(); }
  if (el.id === 'fileCsv' && el.files.length) { importFiles([...el.files]); el.value = ''; }
  if (el.id === 'fileBackup' && el.files[0]) { restoreBackup(el.files[0]); el.value = ''; }
});

function applyThemeColor() {
  const dt = document.documentElement.dataset.theme;
  const dark = dt ? dt === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('themeColor').setAttribute('content', dark ? '#0F1E23' : '#EAF0F1');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyThemeColor);
if (S.settings.theme) document.documentElement.dataset.theme = S.settings.theme;
applyThemeColor();
render();

// ===== PWA: offline og varig lagring =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

</script>
</body>
