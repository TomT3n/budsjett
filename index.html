<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#EAF0F1">
<title>Budsjett</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Personlig budsjett fra kontoutskrift. Alt lagres lokalt på enheten.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F1; --surface:#FFFFFF; --ink:#14303A; --muted:#5B6F76; --line:#D3DDE0;
  --accent:#0F5E73; --accent-ink:#FFFFFF; --good:#2E7D4F; --bad:#B4464B; --warn:#C9722F;
  --sheet-shadow:0 -8px 30px rgba(20,48,58,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E23; --surface:#172A30; --ink:#E4EDEF; --muted:#90A5AB; --line:#27414A;
    --accent:#5BB6CF; --accent-ink:#0F1E23; --good:#6CC592; --bad:#E3787C; --warn:#E9A15F;
    --sheet-shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E23; --surface:#172A30; --ink:#E4EDEF; --muted:#90A5AB; --line:#27414A;
  --accent:#5BB6CF; --accent-ink:#0F1E23; --good:#6CC592; --bad:#E3787C; --warn:#E9A15F;
  --sheet-shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; padding-bottom:84px}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
main{max-width:560px; margin:0 auto; padding:12px 16px 24px}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.01em}
h2{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num,.figures strong,.amt,.budget-row input,.bars text{white-space:nowrap; font-variant-numeric:tabular-nums}

/* Periodevelger */
.period{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 12px}
.period button.arrow{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:1.3rem; line-height:1}
.period button.arrow:disabled{opacity:.35}
.period .label{border:0; background:none; font-size:1.25rem; font-weight:700; padding:8px 12px; border-radius:10px}

/* Nøkkeltall */
.figures{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:20px}
.figures div{background:var(--surface); padding:10px 12px}
.figures span{display:block; font-size:.8rem; color:var(--muted)}
.figures strong{font-size:1.05rem; font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* Smultring */
.donut-wrap{position:relative; width:min(78vw,300px); margin:4px auto 18px}
.donut{display:block; width:100%; height:auto}
.donut .seg{cursor:pointer; transition:stroke-width .15s}
.donut .seg:hover{stroke-width:30}
.donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; text-align:center}
.donut-center .big{font-size:clamp(1.4rem,6vw,1.9rem); font-weight:800; letter-spacing:-.02em}
.donut-center .cap{font-size:.85rem; color:var(--muted); max-width:60%}

/* Kategoriliste */
.list{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.list li + li{border-top:1px solid var(--line)}
.row{display:grid; grid-template-columns:14px 1fr auto; gap:10px; align-items:center; width:100%; padding:12px 14px; background:none; border:0; text-align:left}
.dot{width:12px; height:12px; border-radius:4px}
.row .name{font-weight:600}
.row .meter{grid-column:2 / 4; height:4px; background:var(--line); border-radius:2px; margin-top:-2px}
.row .meter i{border-radius:2px}
.row .meter i{display:block; height:100%}
.row .pct{color:var(--muted); font-size:.8rem; margin-left:6px}
.row .spread{grid-column:2 / 4; font-size:.75rem; color:var(--muted); margin-top:-4px}

.section{margin-top:26px}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px}
.link{background:none; border:0; color:var(--accent); font-weight:600; padding:0; min-height:44px}
.inline{background:none; border:0; color:var(--accent); font-weight:600; padding:0; font-size:inherit; text-decoration:underline; text-underline-offset:2px}
.todos{display:flex; flex-wrap:wrap; gap:8px; margin:-8px 0 18px}
.todo{min-height:40px; border-radius:999px; padding:0 14px; border:1px solid var(--accent); background:var(--surface); color:var(--accent); font-weight:600; font-size:.88rem}
.todo.warn{border-color:var(--warn); color:var(--warn)}
.partial{text-align:center; font-size:.8rem; color:var(--warn); margin:-8px 0 12px}
.row .meter{position:relative}
.avgmark{position:absolute; top:-3px; width:2px; height:10px; background:var(--ink); border-radius:1px; transform:translateX(-1px)}
.under{color:var(--good); font-weight:600}
.row .spread .over{font-weight:600}
.monthhead{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:24px 2px 0; padding-bottom:6px; border-bottom:2px solid var(--line)}
.monthhead b{font-size:1.05rem}
.monthhead span{font-size:.8rem; color:var(--muted); text-align:right}
.appbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; gap:4px; background:var(--bg); margin:-12px -16px 8px; padding:6px 8px 6px 16px}
.appbar h1{font-size:1.15rem; flex:1; margin:0}
.menubtn,.backbtn{position:relative; width:44px; height:44px; border:0; background:none; border-radius:50%; display:grid; place-items:center; color:var(--ink)}
.backbtn{font-size:1.6rem; margin-left:-12px}
.menubtn svg{width:22px; height:22px; fill:currentColor}
.mdot{position:absolute; top:9px; right:9px; width:9px; height:9px; border-radius:50%; background:var(--warn); border:2px solid var(--bg)}
.menurow{grid-template-columns:1fr auto}
.menurow .spread{grid-column:1 / 3}
.fold summary{display:flex; justify-content:space-between; align-items:baseline; cursor:pointer; list-style:none; min-height:44px; align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary h2::before{content:'▸ '; color:var(--muted)}
.fold[open] summary h2::before{content:'▾ '}
.cand{padding:12px 14px}
.cand .btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.cand .btns .btn{padding:8px 12px; font-size:.9rem}
.flag{font-size:.72rem; font-weight:500; border:1px solid var(--line); border-radius:6px; padding:0 5px; color:var(--muted); vertical-align:1px}
.flag.warn{border-color:var(--warn); color:var(--warn)}
.form textarea{padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; resize:vertical}
.seg2{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px; margin:0 0 14px}
.seg2 button{min-height:40px; border:0; border-radius:9px; background:none; font-weight:600; color:var(--muted)}
.seg2 button[aria-selected="true"]{background:var(--ink); color:var(--bg)}
.asof{font-size:.75rem; color:var(--muted); white-space:nowrap}
.figures em{display:block; font-style:normal; font-size:.75rem; color:var(--muted)}
.rcard{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0; background:var(--bg)}
.rcard h3{font-size:.95rem; margin:0 0 6px}
.rcard p{margin:6px 0 0; font-size:.92rem}
.rcard ul{margin:0; padding-left:18px; font-size:.92rem}
.rcard li{margin:4px 0}
.rgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.rgrid span{display:block; font-size:.75rem; color:var(--muted)}
.networth{text-align:center; margin:4px 0 16px}
.networth span{display:block; color:var(--muted); font-size:.9rem}
.networth strong{font-size:clamp(2rem,9vw,2.6rem); font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.figures.eq em{display:block; font-style:normal; font-size:.75rem; color:var(--muted)}
.form{display:grid; gap:12px; margin:10px 0}
.form label{display:grid; gap:4px; font-size:.85rem; color:var(--muted)}
.form label.check{display:flex; color:var(--ink); font-size:.95rem}
.form input:not([type=checkbox]),.form select{min-height:46px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font-size:1rem}
.btn.danger{color:var(--bad)}
.status li{display:flex; justify-content:space-between; gap:10px; padding:11px 14px; font-size:.9rem}
.status li span:first-child{color:var(--muted)}
.warn{color:var(--warn); font-weight:600}
.budget-row .bar{position:relative; overflow:visible}
.tempo{position:absolute; top:-4px; width:2px; height:16px; background:var(--ink); border-radius:1px; transform:translateX(-1px)}
.back{background:none; border:0; color:var(--accent); font-weight:600; padding:0; min-height:44px; margin-bottom:4px}

.banner{display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px dashed var(--warn); border-radius:14px; padding:12px 14px; margin-bottom:18px}
.banner b{color:var(--warn)}

/* Månedsstolper */
.bars{display:block; width:100%; height:auto; background:var(--surface); border:1px solid var(--line); border-radius:14px}
.bars .hit{fill:transparent; cursor:pointer}
.bars text{font-size:10px; fill:var(--muted); font-family:inherit}
.bars text.val{font-size:9px; fill:var(--ink); font-weight:600}
.readout{font-size:.82rem; color:var(--muted); margin:6px 2px 0}
.readout b{color:var(--ink)}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.8rem; color:var(--muted); margin-top:6px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}

/* Transaksjoner */
.search{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface)}
.chips{display:flex; gap:8px; overflow-x:auto; padding:10px 0 4px; scrollbar-width:none}
.chip{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:0 15px; min-height:44px; font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.day{font-size:.8rem; color:var(--muted); margin:16px 2px 6px}
.tx{display:grid; grid-template-columns:1fr auto; gap:2px 12px; width:100%; text-align:left; background:none; border:0; padding:11px 14px}
.tx .who{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tx .amt{font-weight:700; text-align:right}
.tx .cat{font-size:.8rem; color:var(--muted); display:flex; align-items:center; gap:6px; overflow:hidden; white-space:nowrap}
.tx .cat .dot{width:8px; height:8px; border-radius:3px; flex:none}
.tx .flag{font-size:.72rem; border:1px solid var(--line); border-radius:6px; padding:0 5px}
.tx.ukat .cat{color:var(--warn); font-weight:600}
.filterbar{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; margin-top:10px}
.filterbar .top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.filterbar .top b{font-size:.95rem}
.filterbar .close{border:0; background:none; color:var(--accent); font-weight:600; padding:6px 4px; white-space:nowrap}
.filterbar .period{margin:6px 0 2px}
.filterbar .period .label{font-size:1.05rem}
.filterbar .sum{text-align:center; font-size:1.5rem; font-weight:800}
.filterbar .cmp{text-align:center; font-size:.85rem; color:var(--muted)}
.more{display:block; margin:14px auto 0; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 16px}

/* Budsjett */
.budget-row{padding:14px; display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center}
.budget-row .bar{grid-column:1 / 3; height:8px; background:var(--line); border-radius:4px; overflow:hidden}
.budget-row .bar i{display:block; height:100%; border-radius:4px; max-width:100%}
.budget-row input{width:104px; text-align:right; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg)}
.budget-row .meta{grid-column:1 / 3; font-size:.8rem; color:var(--muted); display:flex; justify-content:space-between; gap:8px}
.over{color:var(--bad); font-weight:600}

/* Knapper */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; padding:12px 16px; border:1px solid var(--line); background:var(--surface); font-weight:600}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.stack > * + *{margin-top:10px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px}
.empty{text-align:center; padding:48px 12px}
.empty h2{font-size:1.4rem; margin-bottom:8px}
.rule{display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:10px 14px; align-items:center}
.rule button{border:0; background:none; color:var(--bad); padding:8px}
label.check{display:flex; gap:10px; align-items:flex-start; padding:8px 0}
label.check input{width:20px; height:20px; margin-top:2px; accent-color:var(--accent)}

/* Bunnmeny */
nav.tabs{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(4,1fr); padding-bottom:env(safe-area-inset-bottom,0px); z-index:10}
nav.tabs button{border:0; background:none; padding:10px 2px 12px; font-size:.74rem; min-width:0; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px}
nav.tabs button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink); font-weight:700}
.badge{background:var(--warn); color:#fff; border-radius:999px; font-size:.65rem; padding:0 5px; margin-left:2px}

/* Ark */
.overlay{position:fixed; inset:0; background:rgba(10,25,30,.45); z-index:20; display:none}
.overlay.open{display:block}
.sheet{overscroll-behavior:contain; position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--surface); border-radius:20px 20px 0 0;
  box-shadow:var(--sheet-shadow); max-height:88%; overflow:auto; padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%); visibility:hidden; transition:transform .22s ease-out, visibility 0s linear .22s; max-width:640px; margin:0 auto}
.sheet.open{transform:none; visibility:visible; transition:transform .22s ease-out}
.grip{width:40px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 12px}
.sheet .amount{font-size:1.6rem; font-weight:800}
.details{font-size:.82rem; color:var(--muted); background:var(--bg); border-radius:10px; padding:8px 10px; margin:10px 0; word-break:break-word}
.maincats{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:10px 0}
.maincats button{display:flex; align-items:center; gap:8px; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); text-align:left; font-size:.9rem}
.maincats button[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); font-weight:700}
.subcats{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px}
.sheet-actions{display:grid; grid-template-columns:1fr 2fr; gap:10px; margin-top:12px; position:sticky; bottom:calc(-16px - env(safe-area-inset-bottom,0px)); background:var(--surface); padding:10px 0 16px}
.vh{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; clip:rect(0 0 0 0)}
.match{border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:.9rem}
.match .btns{display:flex; gap:8px; margin-top:8px}
.match .btns .btn{padding:8px 12px; font-size:.9rem}
textarea.paste{width:100%; min-height:180px; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--bg); font-size:.8rem}
.toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:10px 16px; border-radius:12px; z-index:30; font-size:.9rem; max-width:90%; opacity:0; transition:opacity .2s; pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ .sheet,.toast,.donut .seg{transition:none} }
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs" aria-label="Hovedmeny">
  <button data-tab="oversikt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 5"/></svg>Oversikt</button>
  <button data-tab="budsjett"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Budsjett</button>
  <button data-tab="avtaler"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></svg>Avtaler</button>
  <button data-tab="formue"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6M5 10v9M19 10v9M9.5 10v9M14.5 10v9M3 21h18"/></svg>Formue</button>
  
</nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Velg kategori"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileCsv" class="vh" accept=".csv,text/csv,text/comma-separated-values,text/plain,*/*" multiple tabindex="-1">
<input type="file" id="fileBackup" class="vh" accept=".json,application/json,*/*" tabindex="-1">

<script>
// ===== Kjernelogikk: parsing, kategorier, regler =====
const CATS = {
  bolig:      { name: 'Bolig', color: '#2F5D8A', type: 'exp', subs: { laan: 'Boliglån (renter og gebyr)', felles: 'Felleskostnader', strom: 'Strøm', forsikring: 'Innbo- og reiseforsikring', kommunal: 'Kommunale avgifter', annet: 'Annet' } },
  mat:        { name: 'Mat & drikke', color: '#3F8A5A', type: 'exp', subs: { dagligvarer: 'Dagligvarer', restaurant: 'Restaurant', takeaway: 'Take-away & gatekjøkken', kafe: 'Kafé, bakeri & kiosk', bar: 'Bar & uteliv', alkohol: 'Vinmonopolet' } },
  transport:  { name: 'Transport', color: '#C9722F', type: 'exp', subs: { drivstoff: 'Drivstoff & lading', parkering: 'Parkering', bom: 'Bom & ferje', kollektiv: 'Kollektiv', sparkesykkel: 'Sparkesykkel', vedlikehold: 'Service, vask & deler', dekk: 'Dekk', avgifter: 'Bilavgifter', bilkjop: 'Bilkjøp', billan: 'Billån', bilforsikring: 'Bilforsikring', bilapp: 'Bilapp & tilkobling' } },
  abonnement: { name: 'Abonnementer', color: '#7B4F9E', type: 'exp', subs: { strommetjenester: 'Strømmetjenester', mobil: 'Mobil & internett', programvare: 'Programvare & AI', apper: 'Apper', nyheter: 'Nyheter', bank: 'Bank- og kortgebyr' } },
  shopping:   { name: 'Shopping', color: '#B4464B', type: 'exp', subs: { elektronikk: 'Elektronikk', klaer: 'Klær & sko', interior: 'Møbler & interiør', sport: 'Sport & friluft', bygg: 'Bygg & verktøy', diverse: 'Diverse' } },
  helse:      { name: 'Helse & velvære', color: '#23918F', type: 'exp', subs: { apotek: 'Apotek', lege: 'Lege, tannlege & sykehus', trening: 'Trening', pleie: 'Frisør & pleie' } },
  fritid:     { name: 'Fritid', color: '#CFA02B', type: 'exp', subs: { spill: 'Spill', tipping: 'Tipping', opplevelser: 'Kino & opplevelser', hobby: 'Hobby', reise: 'Reise' } },
  utdanning:  { name: 'Utdanning', color: '#5873B8', type: 'exp', subs: { semester: 'Semesteravgift', annet: 'Kurs & annet' } },
  gaver:      { name: 'Gaver', color: '#D0678F', type: 'exp', subs: { gaver: 'Gaver', blomster: 'Blomster' } },

const WORD = 'A-ZÆØÅÄÖÜÉ0-9';
function kwToRegex(kw) {
  let s = kw, lead = true, trail = true;
  if (s.startsWith('*')) { lead = false; s = s.slice(1); }
  if (s.endsWith('*')) { trail = false; s = s.slice(0, -1); }
  s = s.replace(/[.+?^${}()|[\]\\&]/g, m => '\\' + m);
  return (lead ? `(?:^|[^${WORD}])` : '') + s + (trail ? `(?=$|[^${WORD}])` : '');
}
const COMPILED_RULES = KEYWORD_RULES.map(([dir, kws, cat]) => ({
  dir, cat, re: new RegExp(kws.map(kwToRegex).join('|')),
}));

// ---- CSV ----
function parseCSVText(text) {
  text = text.replace(/^\uFEFF/, '');
  const firstLine = text.slice(0, text.indexOf('\n'));
  const delim = (firstLine.split(';').length >= firstLine.split(',').length) ? ';' : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function toNum(s) {
  if (s == null) return 0;
  s = String(s).replace(/[\s\u00a0]/g, '').replace(/NOK/i, '');
  if (!s) return 0;
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function parseBankCSV(text) {
  const rows = parseCSVText(text);
  const hIdx = rows.findIndex(r => r.some(c => /dato/i.test(c)) && r.some(c => /beløp/i.test(c)));
  if (hIdx < 0) throw new Error('Fant ikke kolonneoverskrifter. Er dette en CSV fra nettbanken?');
  const H = rows[hIdx].map(h => h.trim().toLowerCase());
  const col = (...names) => { for (const n of names) { const i = H.findIndex(h => h === n || h.startsWith(n)); if (i >= 0) return i; } return -1; };
  const c = {
    date: col('utført dato', 'dato'), booked: col('bokført dato'), desc: col('beskrivelse'),
    type: col('type'), sub: col('undertype'), fromAcc: col('fra konto'), sender: col('avsender'),
    toAcc: col('til konto'), recv: col('mottakernavn'), inn: col('beløp inn'), ut: col('beløp ut'),
    amount: col('beløp'), status: col('status'), msg: col('melding'),
  };
  const out = []; let skipped = 0, reserved = 0; const coverage = {};
  for (const r of rows.slice(hIdx + 1)) {
    const g = i => (i >= 0 && r[i] != null ? String(r[i]).trim() : '');
    // Bunntekst: "Inngående saldo pr. 27.09.2025" / "Utgående saldo pr. 27.09.2026" = perioden filen dekker
    const cov = r.join(' ').match(/(inngående|utgående)\s+saldo\s+pr\.?\s*(\d{2})\.(\d{2})\.(\d{4}):?\s*(-?[\d\s.]*\d,\d{2})?/i);
    if (cov) {
      const key = /inng/i.test(cov[1]) ? 'from' : 'to', date = `${cov[4]}-${cov[3]}-${cov[2]}`;
      coverage[key] = date;
      if (key === 'to' && cov[5]) coverage.balance = { date, amount: toNum(cov[5]) };
      continue;
    }
    const d = g(c.date).match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if (!d) { if (r.some(x => x && x.trim())) skipped++; continue; }
    if (/reservert/i.test(g(c.status))) { reserved++; continue; }
    let amount = (c.inn >= 0 || c.ut >= 0) ? toNum(g(c.inn)) + toNum(g(c.ut)) : toNum(g(c.amount));
    out.push({
      date: `${d[3]}-${d[2]}-${d[1]}`,
      desc: g(c.desc), type: g(c.type), sub: g(c.sub),
      fromAcc: g(c.fromAcc), sender: g(c.sender), toAcc: g(c.toAcc), recv: g(c.recv),
      amount: Math.round(amount * 100) / 100, msg: g(c.msg).replace(/\s+/g, ' '),
    });
  }
  if (!coverage.from && out.length) coverage.from = out.reduce((a, t) => t.date < a ? t.date : a, out[0].date);
  if (!coverage.to && out.length) coverage.to = out.reduce((a, t) => t.date > a ? t.date : a, out[0].date);
  const accCount = {};
  for (const t of out) if (t.amount < 0 && t.fromAcc) accCount[t.fromAcc] = (accCount[t.fromAcc] || 0) + 1;
  coverage.account = Object.entries(accCount).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
  // Reserve: let etter saldoen i hele teksten, i tilfelle bunnteksten er delt opp annerledes
  if (!coverage.balance) {
    const m = text.match(/utg[åa]ende\s+saldo[^0-9]{0,20}(\d{2})\.(\d{2})\.(\d{4})[^0-9\-]{0,20}(-?\d[\d\s.]*,\d{2})/i);
    if (m) { coverage.balance = { date: `${m[3]}-${m[2]}-${m[1]}`, amount: toNum(m[4]) }; coverage.to = coverage.to || coverage.balance.date; }
  }
  return { tx: out, skipped, reserved, coverage };
}

// Stabil ID for duplikatsjekk (samme kjøp importert to ganger)
function txSig(t) {
  return [t.date, t.amount.toFixed(2), t.desc, t.fromAcc, t.toAcc, t.msg].join('|');
}

// Slår sammen: for hver signatur beholdes max(antall eksisterende, antall nye).
// Da overlever to like ekte kjøp samme dag, men overlappende import dupliserer ikke.
function mergeTx(existing, incoming) {
  const have = new Map();
  for (const t of existing) have.set(t.sig, (have.get(t.sig) || 0) + 1);
  const seenNew = new Map(); const added = [];
  for (const t of incoming) {
    const sig = txSig(t);
    const n = (seenNew.get(sig) || 0) + 1; seenNew.set(sig, n);
    if (n > (have.get(sig) || 0)) added.push({ ...t, sig, id: sig + '#' + n });
  }
  return { added, dupes: incoming.length - added.length };
}

// ---- Kategorisering ----
function vippsName(msg) {
  const m = msg.match(/Vipps\*(?:Vipps\*)?\s*([^*]+?)\s+Kurs:/i);
  return m ? m[1] : '';
}

function merchantKey(t) {
  let s = t.desc || '';
  if (/^overføring$/i.test(s.trim())) s = vippsName(t.msg) || t.msg;
  if (/^til konto:/i.test(s)) s = s.replace(/[^\d]/g, '');
  s = s.toUpperCase()
    .replace(/\(\d{11}\)/g, ' ')
    .replace(/^\d{2}\.\d{2}\s+/, '')
    .replace(/[*_@#.,:/\\()]/g, ' ');
  const stop = new Set(['VIPPS', 'ZETTLE', 'DINTER', 'W', 'AS', 'ASA', 'AVD', 'NOK', 'SA', 'NO', 'COM', 'WWW', 'LØNN', 'FRA']);
  const toks = s.split(/\s+/).filter(w => w && !stop.has(w) && !/^\d+$/.test(w));
  const key = toks.filter(w => !/\d/.test(w)).slice(0, 2).join(' ') || toks.slice(0, 2).join(' ') || s.trim();
  return (t.amount < 0 ? '−' : '+') + ' ' + key;
}

function detectOwner(txs) {
  const cnt = {};
  for (const t of txs) if (/varekjøp/i.test(t.type) && t.sender && !/konto/i.test(t.sender)) cnt[t.sender] = (cnt[t.sender] || 0) + 1;
  return Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
}

function autoCategory(t, owner) {
  const hay = ` ${t.desc} ${t.recv} ${t.msg} `.toUpperCase().replace(/\s+/g, ' ');
  const inc = t.amount > 0;
  if (/lønn/i.test(t.type) || /lønn/i.test(t.sub)) return 'inntekt/lonn';
  if (/nedbetaling av lån/i.test(t.sub)) return 'bolig/laan';
  if (/omkostning/i.test(t.type)) return 'abonnement/bank';
  if (/kundeutbytte/i.test(t.sub)) return 'inntekt/annet';
  const personLike = /straksbetaling|kreditoverføring|betaling med melding/i.test(t.sub);
  if (personLike && owner && t.desc.toUpperCase().startsWith(owner.toUpperCase())) return 'overforing/egne';
  for (const r of COMPILED_RULES) {
    if (r.dir === '+' && !inc) continue;
    if (r.dir === '-' && inc && !/varekjøp/i.test(t.type)) continue; // refusjon på kortkjøp beholder butikkens kategori
    if (r.re.test(hay)) return r.cat;
  }
  if (personLike) return 'overforing/personer';
  return 'ukat/ukat';
}

if (typeof module !== 'undefined') module.exports = { CATS, parseBankCSV, mergeTx, merchantKey, autoCategory, detectOwner, txSig };

// ===== Vipps/overføringer mellom venner =====
const PERSON_SUB = /straksbetaling|kreditoverføring|betaling med melding/i;
function isPersonTransfer(t) { return PERSON_SUB.test(t.sub) || /^overføring$/i.test((t.desc || '').trim()); }

// Faktisk dato: kortkjøp bokføres ofte 1–3 dager etter kjøpet
function realDate(t) {
  const y = +t.date.slice(0, 4), bm = +t.date.slice(5, 7);
  let m = t.msg.match(/\*\d{4} (\d{2})\.(\d{2}) /) || (t.desc + ' ').match(/^(\d{2})\.(\d{2}) /) || t.msg.match(/^(\d{2})\.(\d{2}) /);
  if (m) { const mm = +m[2]; const yy = mm > bm ? y - 1 : y; return `${yy}-${m[2]}-${m[1]}`; }
  m = t.msg.match(/Betalt: (\d{2})\.(\d{2})\.(\d{2})/);
  if (m) return `20${m[3]}-${m[2]}-${m[1]}`;
  return t.date;
}
function dayDiff(a, b) { return Math.round((Date.parse(a) - Date.parse(b)) / 864e5); }

// Fritekst personen skrev (f.eks. "Kebab pizza"), uten bankens standardtekst
function noteOf(t) {
  if (!isPersonTransfer(t)) return '';
  return (t.msg || '')
    .replace(/^(Fra|Til):\s*.*?(Betalt:\s*\d{2}\.\d{2}\.\d{2}|$)/i, '')
    .replace(/\*\d{4}.*?Kurs:\s*[\d.]+/i, '')
    .replace(/^\s*vipps\s*$/i, '')
    .trim();
}

// Nøkkelord i meldingen -> antatt kategori + hvilke hovedkategorier et kjøp kan ha
const NOTE_RULES = [
  { re: /pizza|pezza|kebab|burger|sushi|taco|foodora|wolt|domino|mcd|grill|take ?away|pølse|nudler|thai/i, cat: 'mat/takeaway', allow: ['mat'] },
  { re: /middag|lunsj|frokost|\bmat\b|restaurant|brunch|kaffe|kake/i, cat: 'mat/restaurant', allow: ['mat'] },
  { re: /\bøl\b|\bpils|vors|\bbar\b|drikke|\bvin\b|shots|polet|vinmonopol/i, cat: 'mat/bar', allow: ['mat'] },
  { re: /gave|bursdag|morsdag|farsdag|\bjul|bryllup|presang|konfirmasjon|dåp/i, cat: 'gaver/gaver', allow: ['gaver', 'shopping', 'mat'] },
  { re: /kino|billett|konsert|bowling|golf|escape|festival|teater|fotball|kamp/i, cat: 'fritid/opplevelser', allow: ['fritid', 'mat'] },
  { re: /minecraft|server|discord|abonnement|netflix|spotify/i, cat: 'abonnement/programvare', allow: ['abonnement/programvare'], maxDays: 45 },
  { re: /spill|steam|playstation|xbox/i, cat: 'fritid/spill', allow: ['fritid', 'abonnement'] },
  { re: /bensin|diesel|lading|drivstoff|ferje|\bbom|parkering|taxi|\btur\b|kjøring|skyss/i, cat: 'transport/drivstoff', allow: ['transport'] },
  { re: /hytte|ferie|\bfly|hotell|reise|airbnb/i, cat: 'fritid/reise', allow: ['fritid', 'transport'] },
  { re: /strøm|husleie|felles|internett/i, cat: 'bolig/strom', allow: ['bolig'] },
];
function noteRule(t) { const n = noteOf(t); if (!n) return null; return NOTE_RULES.find(r => r.re.test(n)) || null; }

function sharesWord(note, desc) {
  const w = s => new Set(s.toLowerCase().split(/[^a-zæøå0-9]+/).filter(x => x.length >= 4));
  const a = w(note), b = w(desc); for (const x of a) if (b.has(x)) return true; return false;
}
// Kategorier der det er vanlig å legge ut for andre
const SOCIAL = new Set(['mat/restaurant', 'mat/takeaway', 'mat/bar', 'mat/kafe', 'fritid/opplevelser']);

/**
 * Kobler innbetalinger fra venner til kjøp du har gjort.
 * - Med melding (f.eks. "pizza"): kjøp i passende kategori, inntil 14 dager før / 2 dager etter.
 * - Uten melding: kun restaurant/take-away/bar/kafé/opplevelser, inntil 3 dager før / 1 dag etter.
 * - Sum tilbakebetalt til ett kjøp kan ikke overstige kjøpsbeløpet.
 * catOfBase(t) = kategori uten koblinger. Returnerer Map(innbetaling.id -> {purchaseId, cat, how}).
 */
function matchRefunds(txs, catOfBase) {
  const res = new Map();
  const purchases = txs.filter(t => t.amount < 0 && !isPersonTransfer(t))
    .map(t => ({ t, cat: catOfBase(t), day: realDate(t), left: -t.amount }));

function rateTxt(r) { return `${Math.round(r * 100)} %`; }
function last12() { const ms = monthsInData(); if (!ms.length) return []; const out = []; for (let i = 11; i >= 0; i--) out.push(addMonths(ms.at(-1), -i)); return out; }
// Sparerate per måned: (inn − ut) / inn
function rateSVG(active) {

function openReport(m) {

function viewBudget() {
  if (!S.tx.length) return emptyState();
  const months = monthsInData();
  if (!ui.budPeriod || !months.includes(ui.budPeriod)) ui.budPeriod = completeMonths().at(-1) || months.at(-1);
  const cur = ui.budPeriod, i = months.indexOf(cur);
  const prev = months[i - 1], next = months[i + 1];
  const avgMonths = avgWindow(S.settings.avgN || 6), A = currentAverages();
  const T = totals(cur, { noOneoff: true });
  const mains = Object.keys(CATS).filter(k => CATS[k].type === 'exp');
  const sumBudget = mains.reduce((a, k) => a + (+S.budgets[k] || 0), 0);
  // Tempo: hvor langt ut i måneden dataene går (bare for påbegynt måned)
  const sp = dataSpan(), partial = sp.to && sp.to < monthEnd(cur) && sp.to.slice(0, 7) === cur;
  const frac = partial && daysSince(sp.to) <= 7 ? +sp.to.slice(8, 10) / +monthEnd(cur).slice(8, 10) : null;
  let html = `<div class="period">
      <button class="arrow" data-budperiod="${prev || ''}" ${prev ? '' : 'disabled'} aria-label="Forrige måned">‹</button>
      <h1 class="label" style="font-size:1.15rem">Budsjett ${periodLabel(cur)}</h1>
      <button class="arrow" data-budperiod="${next || ''}" ${next ? '' : 'disabled'} aria-label="Neste måned">›</button></div>
    ${partialNote(cur) ? `<p class="partial">${partialNote(cur)}</p>` : ''}
    <div class="figures">
      <div><span>Budsjettert</span><strong class="num">${kr(sumBudget)}</strong></div>
      <div><span>Brukt</span><strong class="num ${sumBudget && T.exp > sumBudget ? 'neg' : ''}">${kr(T.exp)}</strong></div>
      <div><span>Snitt inn</span><strong class="num">${kr(A.inc)}</strong></div></div>
    ${frac ? `<p class="muted small">Du er ${Math.round(frac * 100)} % ut i måneden. Den loddrette streken viser hvor mye du «burde» ha brukt så langt. Faste regninger kommer ofte på én dag, så den passer best for mat, shopping og fritid.</p>` : ''}
    ${T.hidden ? `<p class="muted small">${T.hidden} engangspost${T.hidden > 1 ? 'er' : ''} (${kr(T.hiddenSum)}) er ikke med i budsjettet for denne måneden.</p>` : ''}
    <p class="muted small">Snitt: ${avgMonths.length ? `${monShort(avgMonths[0])} – ${monShort(avgMonths.at(-1))} (${avgMonths.length} hele måneder)` : '–'}, samme valg som i Snitt under Oversikt.</p>
    <div class="stack" style="margin:12px 0 16px"><button class="btn block" data-fillbudget>Fyll inn tomme felt med snittet</button></div>
    <ul class="list">`;
  for (const k of mains) {
    const spent = T.byMain[k] || 0, b = +S.budgets[k] || 0, avg = A.byMain[k] || 0;
    if (!b && !spent && !avg) continue;
    const pct = b ? Math.min(100, spent / b * 100) : 0, over = b && spent > b;
    const ahead = b && frac && spent > b * frac;
    html += `<li class="budget-row">
      <span class="name" style="display:flex;align-items:center;gap:8px;font-weight:600"><span class="dot" style="background:${CATS[k].color}"></span>${esc(CATS[k].name)}</span>
      <input inputmode="numeric" pattern="[0-9]*" placeholder="Mål" value="${b || ''}" data-budget="${k}" aria-label="Månedlig mål for ${esc(CATS[k].name)}">
      <span class="bar"><i style="width:${b ? pct : 0}%;background:${over ? 'var(--bad)' : ahead ? 'var(--warn)' : CATS[k].color}"></i>${b && frac ? `<b class="tempo" style="left:${(frac * 100).toFixed(1)}%"></b>` : ''}</span>
      <span class="meta"><span class="${over ? 'over' : ''}">${kr(spent)} brukt${b ? (over ? ` · ${kr(spent - b)} over` : ` · ${kr(b - spent)} igjen`) : ''}</span><span>snitt ${kr(avg)}</span></span></li>`;
  }
  return html + '</ul>';
}

// ===== Avtaler: abonnementer og forsikringer =====
const DEAL_CATS = {
  'abonnement/strommetjenester': 'abo', 'abonnement/mobil': 'abo', 'abonnement/programvare': 'abo', 'abonnement/apper': 'abo',
  'abonnement/nyheter': 'abo', 'helse/trening': 'abo', 'transport/bilapp': 'abo',
  'transport/bilforsikring': 'fors', 'bolig/forsikring': 'fors',
};
const DEAL_GROUPS = { abo: 'Abonnementer', fors: 'Forsikringer', annet: 'Andre faste' };
const EVERY = { 1: 'hver måned', 2: 'annenhver måned', 3: 'hvert kvartal', 6: 'hvert halvår', 12: 'hvert år' };
function addMonthsISO(iso, n) { const d = new Date(iso + 'T12:00'); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0, 10); }
let dealCache = null;
function detectDeals() {
  if (dealCache) return dealCache;
  const end = dataSpan().to || today(), groups = new Map();
  for (const t of S.tx) {
    if (t.amount >= 0 || t.oneoff) continue;
    const cat = catOf(t), g = DEAL_CATS[cat]; if (!g) continue;
    const e = groups.get(t.key) || { key: t.key, cat, g, tx: [] }; e.tx.push(t); e.cat = cat; e.g = g; groups.set(t.key, e);
  }
  const out = [];
  // Betalingsformidlere (Google Play, App Store, PayPal) samler flere abonnementer under ett navn.
  // Da deles trekkene opp i grupper etter beløp, og hver gruppe blir sin egen avtale.
  const units = [];
  for (const e of groups.values()) {
    const split = S.deals[e.key]?.split ?? AGGREGATOR.test(e.key);
    if (!split) { units.push({ ...e, base: e.key }); continue; }
    const byAmt = [...e.tx].sort((a, b) => a.amount - b.amount), clusters = [];
    for (const t of byAmt) {
      const c = clusters.find(c => Math.abs(-t.amount - c.ref) <= c.ref * .15);
      if (c) { c.tx.push(t); c.ref = median(c.tx.map(x => -x.amount)); } else clusters.push({ ref: -t.amount, tx: [t] });
    }
    for (const c of clusters) {
      const med = Math.round(median(c.tx.map(t => -t.amount)));
      units.push({ ...e, key: `${e.key}#${med}`, base: e.key, tx: c.tx, suffix: ` · ${kr(med)}` });
    }
  }
  for (const e of units) {
    const d = S.deals[e.key] || {};
    if (d.status === 'ignore' || (e.base !== e.key && S.deals[e.base]?.status === 'ignore' && !S.deals[e.key])) continue;
    const occ = e.tx.sort((a, b) => a.date.localeCompare(b.date)), amts = occ.map(t => -t.amount), med = median(amts);
    const reg = occ.filter(t => Math.abs(-t.amount - med) <= med * .25);
    const ms = [...new Set(occ.map(t => t.date.slice(0, 7)))].sort();
    let every = null;
    if (ms.length >= 2) {
      const gaps = []; for (let i = 1; i < ms.length; i++) gaps.push(monthDiff(ms[i - 1], ms[i]));
      const m = median(gaps), ev = [1, 2, 3, 6, 12].reduce((b, x) => Math.abs(x - m) < Math.abs(b - m) ? x : b, 1);
      if (gaps.filter(x => Math.abs(x - ev) <= Math.max(1, ev * .34)).length / gaps.length >= .6) every = ev;
    }
    const ev = +d.every || every, last = occ.at(-1), lastReg = reg.at(-1) || last, prevReg = reg.at(-2);
    const price = -lastReg.amount;
    const change = prevReg && Math.abs(price + prevReg.amount) >= 5 && Math.abs(price + prevReg.amount) / -prevReg.amount >= .05
      ? { from: -prevReg.amount, to: price, date: lastReg.date } : null;
    let state;
    if (d.status === 'ended' && !(d.endedAt && last.date > d.endedAt)) state = 'ended';
    else if (d.status === 'active' || (d.status === 'ended' && d.endedAt && last.date > d.endedAt)) state = 'active';
    else if (ev) state = addMonthsISO(last.date, ev) >= addMonthsISO(end, 0).slice(0, 10) || daysBetween(addMonthsISO(last.date, ev), end) <= 12 ? 'active' : 'ended';
    else state = daysBetween(last.date, end) <= 400 ? 'candidate' : 'old';
    if (state === 'old') continue;
    out.push({ key: e.key, base: e.base, split: e.base !== e.key, name: d.name || niceName(last) + (e.suffix || ''), group: d.group || e.g, cat: e.cat, price, every: ev || 1, guessed: !ev,
      last: last.date, next: addMonthsISO(last.date, ev || 1), change, state, count: occ.length, note: d.note || '', link: d.link || '', tx: occ });
  }
  // Avtaler lagt inn manuelt
  for (const [key, d] of Object.entries(S.deals)) {
    if (!d.manual || d.status === 'ignore') continue;
    out.push({ key, manual: true, name: d.name, group: d.group || 'abo', cat: d.group === 'fors' ? 'bolig/forsikring' : d.group === 'annet' ? 'transport/vedlikehold' : 'abonnement/programvare', price: +d.price || 0, every: +d.every || 1,
      last: d.start || '', next: '', change: null, state: d.status === 'ended' ? 'ended' : 'active', count: 0, note: d.note || '', link: d.link || '', tx: [] });
  }
  return dealCache = out.sort((a, b) => b.price / b.every - a.price / a.every);
}
const AGGREGATOR = /GOOGLE PLAY|APPLE|APP STORE|ITUNES|PAYPAL/;

}

// ===== Formue =====
const WKINDS = {
  konto: { t: 'asset', name: 'Bankkonto' }, bolig: { t: 'asset', name: 'Bolig' }, bil: { t: 'asset', name: 'Bil' },
  fond: { t: 'asset', name: 'Aksjer og fond' }, annet: { t: 'asset', name: 'Annen eiendel' },
  boliglan: { t: 'debt', name: 'Boliglån', cat: 'bolig/laan' }, billan: { t: 'debt', name: 'Billån', cat: 'transport/billan' },
  studielan: { t: 'debt', name: 'Studielån', cat: 'finans/studielan' }, kreditt: { t: 'debt', name: 'Kredittkort', cat: 'finans/kreditt' },
  forbrukslan: { t: 'debt', name: 'Forbrukslån', cat: 'finans/forbrukslan' }, gjeld: { t: 'debt', name: 'Annen gjeld', cat: 'finans/annetlan' },

function msgKr(msg, word) { const m = (msg || '').match(new RegExp(word + ':\\s*kr\\s*([\\d.\\s]+,\\d{2})', 'i')); return m ? toNum(m[1]) : null; }
function setAccountBalance(acc, bal) {
  const W = S.wealth, id = 'acct-' + (acc || 'hoved').replace(/\s/g, '');
  let it = W.items.find(x => x.id === id);
  if (!it) { it = { id, kind: 'konto', auto: true, track: true, name: 'Brukskonto' + (acc ? ' ' + acc : ''), value: 0, updated: '', history: [] }; W.items.push(it); }
  it.track = true;
  if (bal.date >= (it.updated || '')) { it.value = bal.amount; it.updated = bal.date; it.history.push({ date: bal.date, value: bal.amount }); snapWealth(); }
}
// Lån: saldo fra siste registrering, justert for avdrag på betalinger etterpå
function loanStatus(it) {
  const cat = WKINDS[it.kind]?.cat, rate = (+it.rate || 0) / 100;
  const pays = cat ? S.tx.filter(t => t.amount < 0 && catOf(t) === cat && t.date > it.updated).sort((a, b) => a.date.localeCompare(b.date)) : [];
  let bal = +it.value || 0, amort = 0, interest = 0;
  for (const p of pays) {
    const ren = msgKr(p.msg, 'Renter'), avd = msgKr(p.msg, 'Avdrag'), fee = msgKr(p.msg, 'Terminomkostninger') || 0;
    const i = ren != null ? ren : bal * rate / 12;
    const free = it.noAmort && (!it.noAmortUntil || p.date <= it.noAmortUntil);
    const a = avd != null ? avd : free ? 0 : Math.max(0, -p.amount - i - fee);
    bal -= a; amort += a; interest += i;
  }
  // Typisk måned: siste betaling i kategorien
  const last = cat ? S.tx.filter(t => t.amount < 0 && catOf(t) === cat).sort((a, b) => b.date.localeCompare(a.date))[0] : null;
  let mInt = bal * rate / 12, mAmort = 0, mPay = last ? -last.amount : 0;
  if (last) {
    const ren = msgKr(last.msg, 'Renter'), avd = msgKr(last.msg, 'Avdrag'), fee = msgKr(last.msg, 'Terminomkostninger') || 0;
    if (ren != null) mInt = ren;
    mAmort = avd != null ? avd : freeNow(it) ? 0 : Math.max(0, mPay - mInt - fee);
  }
  // Månedsbeløp etter avdragsfri periode (annuitet), hvis løpetid er oppgitt
  let after = null;
  if (it.noAmort && +it.years > 0 && rate > 0) { const r = rate / 12, n = +it.years * 12; after = bal * r / (1 - Math.pow(1 + r, -n)); }
  return { bal: Math.max(0, bal), n: pays.length, amort, interest, mInt, mAmort, mPay, after };
}
// Anslag på boliglån ut fra rentebeløpene i kontoutskriften
function impliedMortgage(ratePct) {
  const r = S.tx.filter(t => catOf(t) === 'bolig/laan').sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3).map(t => msgKr(t.msg, 'Renter')).filter(x => x);
  if (!r.length || !ratePct) return null;

function longDate(iso) { return new Date(iso + 'T12:00').toLocaleDateString('nb-NO', { day: 'numeric', month: 'short', year: 'numeric' }); }
const LOAN_CATS = [['bolig/laan', 'boliglan'], ['transport/billan', 'billan'], ['finans/studielan', 'studielan'], ['finans/kreditt', 'kreditt'], ['finans/forbrukslan', 'forbrukslan'], ['finans/annetlan', 'gjeld']];
// Lån som betales fra kontoen, men ikke er lagt inn i Formue ennå
function loanSuggestions() {

    if (S.wealth.items.some(i => i.kind === kind)) continue;
    const pays = S.tx.filter(t => t.amount < 0 && catOf(t) === cat).sort((a, b) => b.date.localeCompare(a.date));
    if (pays.length < 2 || daysSince(pays[0].date) > 70) continue;
    const last = pays[0], ren = msgKr(last.msg, 'Renter'), fee = msgKr(last.msg, 'Terminomkostninger') || 0, avd = msgKr(last.msg, 'Avdrag');
    const onlyInterest = ren != null && avd == null && Math.abs(-last.amount - ren - fee) < 2;

function trackedSince(it) { return S.tx.filter(t => t.date > it.updated); }
function itemValue(it) {

(function sheetDrag() {

  sh.addEventListener('touchend', () => {
    if (y0 == null) return;
    const v = dy / Math.max(1, Date.now() - t0);

// ===== Tilbake-knapp (Android) og oppdatering =====
// Hvert «lag» (fane, kategori, underkategori, ark) blir et steg i nettleserhistorikken.
// Tilbake-bevegelsen går da ett lag opp i stedet for å lukke appen, og en oppdatering
// (dra ned) beholder fanen du står i.
const NAV_KEYS = ['tab', 'mode', 'drill', 'avgDrill', 'cat', 'kind', 'period'];
const nav = { idx: 0, stack: [], restoring: false, expectPop: false, closing: false, sheetEntry: false };
function navState() { const o = {}; for (const k of NAV_KEYS) o[k] = ui[k] ?? null; if (o.mode !== 'avg') o.mode = null; return o; }
function navSig(s) { return [s.tab, s.mode, s.drill, s.avgDrill, s.cat, s.kind].join('|'); }
function syncHistory() {
  if (nav.restoring || nav.closing || nav.sheetEntry || nav.expectPop || nav.resetting || nav.rebuilding) return;
  const cur = navState(), sig = navSig(cur), h = history.state;
  if (!h || h.i == null) { nav.idx = 0; nav.stack = [sig]; history.replaceState({ ...cur, i: 0 }, ''); return; }
  if (navSig(h) === sig) { nav.stack[nav.idx] = sig; history.replaceState({ ...cur, i: nav.idx }, ''); return; }
  if (nav.idx > 0 && nav.stack[nav.idx - 1] === sig) { nav.idx--; nav.expectPop = true; history.back(); return; }
  nav.stack.splice(nav.idx + 1); nav.idx++; nav.stack[nav.idx] = sig;
  history.pushState({ ...cur, i: nav.idx }, '');

window.addEventListener('popstate', e => {

  if (nav.closing) { nav.closing = false; syncHistory(); return; }
  if (nav.expectPop) { nav.expectPop = false; history.replaceState({ ...navState(), i: nav.idx }, ''); return; }
  if (nav.sheetEntry) { nav.sheetEntry = false; hideSheet(); return; }
  const st = e.state; if (!st) return;
  const same = navSig(st) === navSig(navState());
  nav.idx = st.i ?? 0; nav.stack[nav.idx] = navSig(st);
  if (same) { history.back(); return; } // hopp over dubletter
  nav.restoring = true;
  // Behold måneden du har bladd til, med mindre en av dem er et snitt-område
  const keepPeriod = ui.period && st.period && !String(ui.period).startsWith('r:') && !String(st.period).startsWith('r:');
  for (const k of NAV_KEYS) if (!(k === 'period' && keepPeriod)) ui[k] = st[k];

      `<button class="chip" data-ssub="${ui.sheetMain}/${s}" aria-pressed="${ui.sheetCat === ui.sheetMain + '/' + s}">${esc(n)}</button>`).join('')}</div>` : ''}
    <label class="check"><input type="checkbox" id="remember" ${isPersonTransfer(t) ? '' : 'checked'}><span>Husk for alle fra «${esc(t.key.slice(2))}»${same ? ` <span class="muted small">(${same} til)</span>` : ''}${isPersonTransfer(t) ? '<br><span class="muted small">Av som standard for personer, siden venner betaler for ulike ting.</span>' : ''}</span></label>
    <label class="check"><input type="checkbox" id="oneoff" ${t.oneoff || isBig(t) ? 'checked' : ''}><span>Engangspost <span class="muted small">(vises i måneden, men holdes utenfor snittet)</span></span></label>
    <div class="sheet-actions">
      ${t.cat ? `<button class="btn" data-sreset>Automatisk</button>` : `<button class="btn" data-sclose>Avbryt</button>`}
      <button class="btn primary" data-ssave ${ui.sheetCat && ui.sheetCat !== 'ukat/ukat' && ui.sheetCat.startsWith(ui.sheetMain + '/') ? '' : 'disabled'}>Lagre kategori</button>
    </div>`;
}
function saveSheet() {
  const t = S.tx.find(x => x.id === ui.sheet); if (!t) return;
  const remember = document.getElementById('remember').checked;
  t.oneoff = document.getElementById('oneoff').checked || undefined;
  const cat = ui.sheetCat;
  if (remember) {
    S.rules[t.key] = cat; delete t.cat;
    const n = S.tx.filter(x => x.key === t.key && !x.cat).length;
    toast(`Lagret. ${n} transaksjon${n > 1 ? 'er' : ''} fra «${t.key.slice(2)}» er nå ${catLabel(cat)}.`);
  } else { t.cat = cat; toast('Lagret for denne transaksjonen.'); }
  save(); closeSheet(); render();
}

// ===== Import / eksport =====
async function importFiles(files) {
  const items = [];
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.includes('\uFFFD')) text = new TextDecoder('windows-1252').decode(buf);
      items.push({ name: f.name, text });
    } catch (e) { items.push({ name: f.name, text: '', err: 'Kunne ikke lese filen: ' + e.message }); }
  }
  return importTexts(items);
}
async function importTexts(items) {
  const lines = [];
  for (const f of items) {
    try {
      if (f.err) throw new Error(f.err);
      const { tx, skipped, reserved, coverage } = parseBankCSV(f.text);
      if (coverage.from && coverage.to) addCoverage(coverage.from, coverage.to);
      if (coverage.balance) setAccountBalance(coverage.account, coverage.balance);
      const { added, dupes } = mergeTx(S.tx, tx);
      if (!S.owner) S.owner = detectOwner(tx);
      for (const t of added) t.key = merchantKey(t);
      S.tx.push(...added); S.lastImport = new Date().toISOString();
      const uk = added.filter(t => catOf(t) === 'ukat/ukat').length;
      lines.push(`<b>${esc(f.name)}</b>: ${added.length} nye, ${dupes} fantes fra før${reserved ? `, ${reserved} reservert (venter)` : ''}${uk ? `. <b>${uk}</b> trenger kategori` : ''}. ${coverage.balance ? `Saldo ${kr(coverage.balance.amount)} per ${shortDate(coverage.balance.date)} er lagt inn under Formue.` : '<span class="warn">Fant ingen saldo i filen.</span> Legg den inn selv under Formue.'}`);
    } catch (e) { lines.push(`<b>${esc(f.name)}</b>: <span class="neg">${esc(e.message)}</span>`); }
  }
  snapWealth(); save();
  const months = monthsInData(); if (!ui.period || !months.includes(ui.period) && ui.period !== '12m') ui.period = months.at(-1);
  render();
  const box = document.getElementById('importResult');
  if (box) box.innerHTML = `<div class="details" style="color:var(--ink)">${lines.join('<br>')}</div>`;
  else toast('Import ferdig');
}
async function exportBackup() {
  const data = JSON.stringify({ app: 'budsjett', version: 1, exported: new Date().toISOString(), ...S });
  const name = `budsjett-backup-${new Date().toISOString().slice(0, 10)}.json`;
  try {
    const dl = window.claude?.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: name, data }); S.lastBackup = new Date().toISOString(); save(); render(); toast('Sikkerhetskopi lagret'); return; }
  } catch (e) { if (e?.code === 'declined') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  S.lastBackup = new Date().toISOString(); save(); render();
}
async function restoreBackup(f) {
  try {
    const s = JSON.parse(await f.text());
    if (!Array.isArray(s.tx)) throw new Error('Filen er ikke en sikkerhetskopi fra denne appen.');
    if (!confirm(`Erstatte dagens data med ${s.tx.length} transaksjoner fra sikkerhetskopien?`)) return;
    S = { ...blank(), tx: s.tx, rules: s.rules || {}, budgets: s.budgets || {}, settings: { ...blank().settings, ...(s.settings || {}) }, owner: s.owner || '', coverage: s.coverage || [], v: s.v || 1, names: s.names || {}, namesExact: s.namesExact || {}, lastImport: s.lastImport || null, lastBackup: s.lastBackup || null, wealth: s.wealth || { items: [], snaps: [] }, deals: s.deals || {} };
    migrate();
    autoMemo.clear(); save(); ui.period = monthsInData().at(-1) || null; render(); toast('Sikkerhetskopi gjenopprettet');
  } catch (e) { toast(e.message); }
}

// ===== Rendering og hendelser =====
let toastTimer;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3200); }

const TITLES = { oversikt: 'Oversikt', snitt: 'Oversikt', tx: 'Transaksjoner', avtaler: 'Avtaler', budsjett: 'Budsjett', formue: 'Formue', data: 'Import og sikkerhetskopi', innst: 'Innstillinger' };
function menuAlert() {
  if (!S.tx.length) return false;
  const bAge = daysSince(S.lastBackup), age = daysSince(dataSpan().to);
  return bAge == null || bAge > 30 || age > 30;
}
function appBar() {
  const sub = ['data', 'innst', 'tx'].includes(ui.tab);
  const to = S.tx.length ? dataSpan().to : null;
  return `<header class="appbar">${sub ? `<button class="backbtn" data-histback aria-label="Tilbake">‹</button>` : ''}<h1>${TITLES[ui.tab]}</h1>${to ? `<span class="asof ${daysSince(to) > 30 ? 'warn' : ''}">Data t.o.m. ${shortDate(to)}</span>` : ''}
    <button class="menubtn" data-menu aria-label="Meny: transaksjoner, import og innstillinger"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>${menuAlert() ? '<i class="mdot"></i>' : ''}</button></header>`;
}
function openMenu() {
  ui.sheet = '__menu';
  const T = S.wealth?.items?.length ? wealthTotals() : null, sp = S.tx.length ? dataSpan() : null, bAge = daysSince(S.lastBackup);
  const item = (tab, title, sub, warn) => `<li><button class="row menurow" data-menugo="${tab}"><span class="name">${title}</span><span class="num">›</span><span class="spread ${warn ? 'warn' : ''}">${sub}</span></button></li>`;
  document.getElementById('sheet').innerHTML = `<div class="grip"></div><h2 style="margin-bottom:10px">Meny</h2>
    <ul class="list">
      ${item('tx', 'Transaksjoner', `Søk og kategoriser${uncategorizedCount() ? ` · <b>${uncategorizedCount()} ukategorisert</b>` : ''}`, uncategorizedCount() > 0)}
      ${item('data', 'Import og sikkerhetskopi', sp ? `Data til ${shortDate(sp.to)} · kopi ${S.lastBackup ? `for ${bAge} dager siden` : 'aldri tatt'}` : 'Importer CSV fra nettbanken', S.tx.length && (bAge == null || bAge > 30 || daysSince(sp.to) > 30))}
      ${item('innst', 'Innstillinger', 'Tema, engangsposter, lærte regler og egne navn', false)}
    </ul>
    <p class="muted small" style="text-align:center;margin-top:12px">Versjon ${APP_VERSION}</p>`;
  showSheet();
}
function render() {
  if (!ui.period || (ui.period !== '12m' && !ui.period.startsWith('r:') && !monthsInData().includes(ui.period))) ui.period = monthsInData().at(-1) || null;
  const v = { oversikt: viewHome, snitt: viewHome, tx: viewTx, budsjett: viewBudget, formue: viewWealth, avtaler: viewDeals, data: viewData, innst: viewSettings }[ui.tab];
  document.getElementById('app').innerHTML = appBar() + v();
  syncHistory();
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === ui.tab ? 'page' : 'false'));
}
function go(tab) { ui.tab = tab; ui.limit = 60; render(); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const el = e.target.closest('button, rect.hit, circle.seg'); if (!el) return;
  const d = el.dataset;
  if ('histback' in d) return history.back();
  if (d.tab) return MAIN_TABS.includes(d.tab) ? switchTab(d.tab) : go(d.tab);
  if ('period' in d && d.period) { ui.period = d.period; return render(); }
  if (d.deal) return openDealSheet(d.deal);
  if ('dealnew' in d) return openDealSheet(null, true);
  if ('dealsave' in d) return saveDeal();
  if (d.dealadd) { S.deals[d.dealadd] = { ...(S.deals[d.dealadd] || {}), status: 'active' }; save(); render(); return toast('Lagt til. Trykk på den for å endre hvor ofte den trekkes.'); }
  if (d.dealignore) { const k = d.dealignore; if (S.deals[k]?.manual) delete S.deals[k]; else S.deals[k] = { ...(S.deals[k] || {}), status: 'ignore' }; save(); if (ui.sheet === '__deal') closeSheet(); return render(); }
  if (d.dealstatus) { const k = ui.dealKey; S.deals[k] = { ...(S.deals[k] || {}), status: d.dealstatus, endedAt: d.dealstatus === 'ended' ? dataSpan().to : undefined }; save(); closeSheet(); return render(); }
  if (d.dealend) { S.deals[d.dealend] = { ...(S.deals[d.dealend] || {}), status: 'ended', endedAt: dataSpan().to }; save(); render(); return toast('Flyttet til Avsluttet. Blir den trukket igjen, dukker den opp som aktiv.'); }
  if ('menu' in d) return openMenu();
  if (d.menugo) { closeSheet(); return go(d.menugo); }
  if (d.wsuggest) return openWealthSheet('new:debt', ui.suggest[+d.wsuggest]);
  if ('wacct' in d) return openWealthSheet('new:asset', { kind: 'konto', name: 'Brukskonto', track: true });
  if (d.witem) return openWealthSheet(d.witem);
  if ('wsave' in d) return saveWealth();
  if (d.wuse) { document.getElementById('wValue').value = d.wuse; return; }
  if ('wdelete' in d) { if (confirm('Slette denne posten fra formuen?')) { S.wealth.items = S.wealth.items.filter(x => x.id !== ui.wid); snapWealth(); save(); closeSheet(); render(); } return; }
  if ('bigtx' in d) { const b = bigTransfers(); if (b.length === 1) return openSheet(b[0].id); ui.kind = 'stor'; ui.cat = null; ui.q = ''; return go('tx'); }
  if ('keeptransfer' in d) { const t = S.tx.find(x => x.id === ui.sheet); if (t) { t.cat = 'overforing/personer'; save(); toast('Beholdt som overføring'); } closeSheet(); return render(); }
  if ('rename' in d) return openRename(ui.sheet);
  if ('rnback' in d) return renderSheet();
  if ('rnsave' in d) return saveRename();
  if (d.delname) { delete S.names[d.delname]; save(); return render(); }
  if (d.delnamex) { delete S.namesExact[d.delnamex]; save(); return render(); }
  if (d.fixedq) { ui.q = d.fixedq; ui.kind = 'alle'; ui.cat = null; return go('tx'); }
  if (d.budperiod) { ui.budPeriod = d.budperiod; return render(); }
  if (d.report) { if (ui.tab !== 'oversikt') { ui.tab = 'oversikt'; render(); } return openReport(d.report); }
  if (d.reportcat) { closeSheet(); ui.tab = 'oversikt'; ui.mode = 'month'; ui.period = d.reportm; ui.drill = d.reportcat; render(); return window.scrollTo(0, 0); }
  if (d.mode) { ui.mode = d.mode; ui.drill = null; ui.avgDrill = null; render(); return window.scrollTo(0, 0); }
  if ('oneoffoff' in d) { S.settings.oneoffInAvg = false; save(); toast('Engangsposter holdes nå utenfor snittet'); return render(); }
  if (d.avgn) { S.settings.avgN = d.avgn === 'alle' ? 'alle' : +d.avgn; save(); return render(); }
  if ('avgdrill' in d) { ui.avgDrill = d.avgdrill || null; render(); return window.scrollTo(0, 0); }
  if (d.showcat && d.range) { ui.cat = d.showcat; ui.period = d.range; ui.kind = 'alle'; ui.q = ''; return go('tx'); }
  if (d.txperiod) { ui.period = d.txperiod; ui.limit = 60; return render(); }
  if ('toggle12' in d) { ui.period = ui.period === '12m' ? monthsInData().at(-1) : '12m'; return render(); }
  if (d.month) { ui.period = d.month; if (ui.mode === 'avg') { ui.mode = 'month'; ui.drill = ui.avgDrill; ui.avgDrill = null; } return render(); }
  if (el.matches('circle.seg') && ui.mode === 'avg' && ui.tab === 'oversikt') {
    const ms = avgWindow(S.settings.avgN || 6), rng = 'r:' + ms[0] + ':' + ms.at(-1);
    if (!ui.avgDrill) { ui.avgDrill = d.id; return render(); }
    ui.cat = d.id; ui.period = rng; ui.kind = 'alle'; ui.q = ''; return go('tx');
  }
  if (el.matches('circle.seg')) {
    if (!ui.drill) { ui.drill = d.id; return render(); }
    ui.cat = d.id; ui.kind = 'alle'; ui.q = ''; return go('tx');
  }
  if ('drill' in d) { ui.drill = d.drill || null; render(); return window.scrollTo(0, 0); }
  if (d.showcat) { ui.cat = d.showcat; ui.kind = 'alle'; ui.q = ''; return go('tx'); }
  if ('gotoPending' in d) { ui.kind = 'antatt'; ui.cat = null; ui.q = ''; return go('tx'); }
  if ('mconfirm' in d) { const t = S.tx.find(x => x.id === ui.sheet), m = matchOf(t); if (m) { t.cat = m.cat; if (m.purchaseId) t.link = m.purchaseId; save(); toast('Bekreftet'); } closeSheet(); return render(); }
  if ('mreject' in d) { const t = S.tx.find(x => x.id === ui.sheet), m = matchOf(t); if (m) { t.rejected = [...(t.rejected || []), m.purchaseId]; save(); const n = matchOf(t); toast(n?.purchaseId ? 'Fant et annet mulig kjøp' : 'Koblingen er fjernet'); } return n2(); }
  if ('paste' in d) return openPaste();
  if ('pasteImport' in d) { const v = document.getElementById('pasteBox').value; if (!v.trim()) return toast('Lim inn innholdet i CSV-filen først'); closeSheet(); ui.tab = 'data'; render(); return importTexts([{ name: 'Innlimt tekst', text: v }]); }
  if ('gotoUkat' in d) { if (ui.sheet) closeSheet(); }
  if ('gotoUkat' in d) { ui.kind = 'ukat'; ui.cat = null; ui.q = ''; return go('tx'); }
  if (d.kind) { ui.kind = d.kind; ui.limit = 60; return render(); }
  if ('clearcat' in d) { ui.cat = null; return render(); }
  if ('more' in d) { ui.limit += 100; return render(); }
  if (d.tx) return openSheet(d.tx);
  if (d.smain) { ui.sheetMain = d.smain; const subs = Object.keys(CATS[d.smain].subs); ui.sheetCat = subs.length === 1 ? d.smain + '/' + subs[0] : null; return renderSheet(); }
  if (d.ssub) { ui.sheetCat = d.ssub; return renderSheet(); }
  if ('ssave' in d) return saveSheet();
  if ('sclose' in d) return closeSheet();
  if ('sreset' in d) { const t = S.tx.find(x => x.id === ui.sheet); if (t) { delete t.cat; delete t.link; save(); } closeSheet(); return render(); }
  if ('export' in d) return exportBackup();
  if ('wipe' in d) { if (confirm('Slette alle transaksjoner, regler og budsjett på denne enheten?')) { S = blank(); autoMemo.clear(); save(); render(); toast('Alle data er slettet'); } return; }
  if (d.delrule) { delete S.rules[d.delrule]; save(); return render(); }
  if ('fillbudget' in d) {
    const acc = currentAverages().byMain;
    let n = 0; for (const [k, v] of Object.entries(acc)) if (!S.budgets[k] && v > 0 && k !== 'ukat') { S.budgets[k] = Math.ceil(v / 100) * 100; n++; }
    save(); render(); return toast(n ? `Fylte inn ${n} mål, rundet opp til nærmeste hundrelapp.` : 'Alle felt har allerede et mål.');
  }
});
document.getElementById('overlay').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) closeSheet(); });
document.addEventListener('input', e => {
  if (e.target.id === 'wRate') return wealthHint();
  if (e.target.matches('[data-search]')) {
    ui.q = e.target.value; ui.limit = 60; const pos = e.target.selectionStart; render();
    const s = document.querySelector('[data-search]'); s.focus(); s.setSelectionRange(pos, pos);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'wKind') { const r = document.getElementById('wTrackRow'); if (r) r.hidden = el.value !== 'konto'; return wealthHint(); }
  if (el.dataset.budget) { const v = parseInt(el.value.replace(/\D/g, ''), 10); if (v) S.budgets[el.dataset.budget] = v; else delete S.budgets[el.dataset.budget]; save(); render(); }
  if (el.dataset.setting) { S.settings[el.dataset.setting] = el.checked; save(); render(); }
  if ('darktoggle' in el.dataset) { document.documentElement.dataset.theme = el.checked ? 'dark' : 'light'; S.settings.theme = document.documentElement.dataset.theme; save(); applyThemeColor(); }
  if (el.id === 'fileCsv' && el.files.length) { importFiles([...el.files]); el.value = ''; }
  if (el.id === 'fileBackup' && el.files[0]) { restoreBackup(el.files[0]); el.value = ''; }
});

function applyThemeColor() {
  const dt = document.documentElement.dataset.theme;
  const dark = dt ? dt === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('themeColor').setAttribute('content', dark ? '#0F1E23' : '#EAF0F1');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyThemeColor);
if (S.settings.theme) document.documentElement.dataset.theme = S.settings.theme;
restoreNavOnLoad();
applyThemeColor();
render();

// ===== PWA: offline og varig lagring =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
